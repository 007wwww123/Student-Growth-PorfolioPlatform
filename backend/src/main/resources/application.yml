server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: student-growth-platform
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:student_growth}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    hikari:
      pool-name: growth-pool
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
    default-property-inclusion: non_null
  servlet:
    multipart:
      # 单文件上限 20MB，与需求文档 4.1.3 附件规则一致
      max-file-size: 20MB
      max-request-size: 100MB

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.college.growth
  configuration:
    map-underscore-to-camel-case: true
    default-statement-timeout: 30
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

security:
  jwt:
    # 至少 32 字符，启动时校验；生产必须用环境变量覆盖，不要沿用此默认值
    secret: ${JWT_SECRET:dev-only-secret-please-override-in-prod-32}
    # 令牌有效期（小时），前端据此决定提前续期
    ttl-hours: ${JWT_TTL_HOURS:8}

growth:
  export:
    # 单人 PDF 落盘目录；为空时用系统临时目录下的 student-growth-export
    dir: ${EXPORT_DIR:}
    # 中文字体；生产镜像需内置字体并指向镜像内路径
    font-path: ${EXPORT_FONT_PATH:C:/Windows/Fonts/simhei.ttf}
  completion:
    # 完成标记补偿重算（BR-S10）：每天 03:30 扫一遍当前学年，只处理绕过状态机的旁路数据
    refresh-enabled: ${COMPLETION_REFRESH_ENABLED:true}
    refresh-cron: ${COMPLETION_REFRESH_CRON:0 30 3 * * ?}

logging:
  level:
    root: info
    com.college.growth: ${LOG_LEVEL_APP:debug}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{36} - %msg%n"

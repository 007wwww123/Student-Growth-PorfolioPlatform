        sectionCode:
          type: string
          description: 板块编码，大写
          example: BASIC
        sectionName:
          type: string
          example: 基本信息
        fields:
          type: array
          items:
            $ref: '#/components/schemas/FieldPermissionVO'
        studentEditable:
          type: integer
          description: 当前配置下学生可编辑的字段数
          example: 5
        counselorEditable:
          type: integer
          description: 当前配置下老师可编辑的字段数
          example: 8
        readonly:
          type: integer
          description: 任何角色都不可编辑的字段数
          example: 8
        customized:
          type: integer
          description: 已偏离默认配置的字段数
          example: 0

    FieldPermissionVO:
      type: object
      description: 单个字段的编辑权限
      properties:
        fieldCode:
          type: string
          example: basic.name
        fieldName:
          type: string
          example: 姓名
        fieldType:
          type: string
          example: TEXT
        source:
          type: string
          description: SIS / COU / STU / STU_CFM / SYS / IMP
          example: SIS
        required:
          type: boolean
        sensitive:
          type: integer
          description: 0 普通 / 1 脱敏 / 2 仅辅导员明文
          example: 0
        editableRoles:
          type: array
          description: 当前生效的可编辑角色，按 STU、COU 固定顺序
          items:
            type: string
            enum: [STU, COU]
        defaultEditableRoles:
          type: array
          description: 初始化时的默认可编辑角色
          items:
            type: string
            enum: [STU, COU]
        permissionMode:
          type: string
          description: 四选一权限模式
          enum: [NONE, STU, COU, BOTH]
          example: NONE
        customized:
          type: boolean
          description: 当前配置是否已偏离默认值
        studentVisible:
          type: boolean
          description: 学生是否可见该字段；不可见时不允许配置为「学生可编辑」（EC-40003）
          example: true
        counselorVisible:
          type: boolean
          description: 老师是否可见该字段；不可见时不允许配置为「老师可编辑」（EC-40003）
          example: true
        locked:
          type: boolean
          description: 固定只读（系统推导、系统生成、学籍唯一标识），不允许配置
        lockedReason:
          type: string
          nullable: true
          example: 该字段由系统按班级自动推导，固定只读

    PermissionSaveDTO:
      type: object
      required: [fields]
      properties:
        fields:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/FieldPermissionDTO'

    FieldPermissionDTO:
      type: object
      required: [fieldCode]
      properties:
        fieldCode:
          type: string
          example: basic.name
        editableRoles:
          type: array
          description: 只能包含 STU / COU；空数组表示任何角色都不可编辑
          items:
            type: string
            enum: [STU, COU]
          example: [STU]

    PermissionSaveResultVO:
      type: object
      properties:
        changed:
          type: integer
          description: 实际更新的字段数；未变化的字段不计入审计
          example: 1
        section:
          $ref: '#/components/schemas/SectionPermissionVO'

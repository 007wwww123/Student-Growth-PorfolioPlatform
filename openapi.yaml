openapi: 3.0.3

info:
  title: 学生成长档案平台 API
  version: 0.1.0
  license:
    name: 内部项目，未授予开源许可
  description: |
    学生成长档案平台后端接口契约。依据《一期建设总流程与可执行方案》第 9.1 节工程约定与
    第 6.1 节错误响应结构编写，代码实现见 `backend/src/main/java/com/college/growth`。

    ## 一、统一响应体

    所有接口一律返回 `Result` 包装，HTTP 状态码只表达传输层结果，业务原因由 `code` 表达：

    ```json
    {
      "code": "0",
      "message": "操作成功",
      "traceId": "a1b2c3d4e5f60708",
      "timestamp": "2026-11-26T15:23:50+08:00",
      "data": {},
      "details": []
    }
    ```

    - `code` 为 `"0"` 表示成功，其余为 `EC-xxxxx` 业务码；
    - `data` 仅在成功且存在业务数据时出现（后端按 `non_null` 序列化）；
    - `details` 仅在字段校验失败（`EC-42201`）时出现，供前端逐字段提示；
    - `traceId` 用于串联服务端日志，用户报障时请一并提供。

    ## 二、板块数据结构：信封 + fields

    六大板块共用「公共信封 + 动态字段」结构，板块自身字段放在 `fields` 内：

    ```json
    {
      "studentId": 1001,
      "academicYear": "2025-2026-1",
      "sectionCode": "BASIC",
      "sectionName": "基本信息",
      "status": "DRAFT",
      "fields": { "name": "李明", "studentNo": "2024010101" },
      "editable": true
    }
    ```

    这样后端可按 `arc_field_def` 动态下发字段（需求文档 4.1），前端表单跟着 `fields` 渲染，
    新增字段不需要改动页面结构。**不要**把板块字段平铺到信封外层，也**不要**再套一层
    `{ basic: {...}, academic: {...} }`。

    ## 三、路径与命名

    - 接口前缀为后端 `server.servlet.context-path`，即 `/api`，本文件中 `servers.url` 已包含；
    - 路径中的板块编码**用小写**（`basic` / `academic` / `interest` / `life` / `career` /
      `mentor`），与 `SectionCodeEnum.code` 一致；
    - 响应体中的 `sectionCode` **用大写**（`BASIC` 等），与 `SectionCodeEnum.name` 一致；
    - 请求与响应字段一律 lowerCamelCase，与各板块 `SaveDTO` / `VO` 属性名一致。

    ## 四、档案状态

    `DRAFT` 草稿 → `SUBMITTED` 已提交 → `APPROVED` 已通过 → `LOCKED` 已归档，
    `SUBMITTED` 可被退回为 `RETURNED`，`RETURNED` 可再次提交。
    **仅 `DRAFT` 与 `RETURNED` 允许保存与提交**，其余状态返回 `EC-40902`。
    `SUBMITTED` 可由学生本人撤回为 `DRAFT`（全生命周期一次），
    也可由该班现任辅导员通过或退回；审核接口见 `## 八、审核`。

    ## 五、错误码

    `EC-` 加五位数字，前三位表示类别，后两位为序号。

    | 业务码 | HTTP | 含义 | 前端建议处理 |
    |---|---|---|---|
    | `EC-40001` | 400 | 请求格式不正确 | 提示刷新重试 |
    | `EC-40002` | 400 | 缺少必要参数 | 检查必传参数 |
    | `EC-40003` | 400 | 参数超出允许范围 | 检查板块编码、ID 格式 |
    | `EC-40101` | 401 | 登录已失效 | 跳转登录 |
    | `EC-40102` | 401 | 登录已过期 | 跳转登录 |
    | `EC-40103` | 401 | 账号被锁定（预留） | 提示稍后再试或联系管理员 |
    | `EC-40104` | 401 | 账号或密码错误 | 就地提示，停留登录页 |
    | `EC-40105` | 401 | 账号被停用 | 提示联系管理员 |
    | `EC-40301` | 403 | 字段由学校维护，不可修改 | 置灰该字段 |
    | `EC-40302` | 403 | 无权访问该学生档案 | 提示无权限 |
    | `EC-40303` | 403 | 当前角色无权执行该操作（如非管理员配置权限、管理员编辑档案内容） | 提示无权限 |
    | `EC-40303` | 403 | 当前角色无权执行该操作（如非管理员配置权限、管理员编辑档案内容） | 提示无权限 |
    | `EC-40902` | 409 | 当前状态不允许该操作 | 刷新详情后重试 |
    | `EC-40903` | 409 | 撤回次数已用完 | 提示不可撤回 |
    | `EC-40907` | 409 | 内容已被他人修改（乐观锁冲突） | 提示刷新后重试 |
    | `EC-42201` | 422 | 字段校验未通过 | 按 `details` 逐字段提示 |
    | `EC-42202` | 422 | 必填内容未填写 | 按 `details` 定位字段 |
    | `EC-42203` | 422 | 退回理由不少于 10 字 | 提示补足字数 |
    | `EC-50000` | 501 | 该功能尚未实现 | 骨架期占位，提示稍后再试 |
    | `EC-50001` | 500 | 系统繁忙 | 提示稍后重试，附 traceId |
    | `EC-50002` | 500 | 文件服务不可用 | 提示稍后重试 |
    | `EC-50003` | 500 | 档案生成失败 | 联系管理员 |

    ## 六、当前实现状态

    - **板块一（basic）后端已闭环**：详情、保存、提交、撤回、待确认字段确认/驳回、敏感字段查看。
      字段定义来自 `arc_field_def`，初始化脚本见
      `backend/src/main/resources/db/sql/03_insert_basic_field_defs.sql`（16 个字段）。
    - **审核模块已独立成公共模块**（`com.college.growth.review`）：待审列表、通过、退回，
      六个板块共用一套状态机与一套接口；板块一通过公共状态机流转，不重复实现审核逻辑。
    - 其余五个板块仍为骨架：路由与 DTO 已就位，Service 返回 `EC-50000`（HTTP 501）。
    - **登录鉴权已接入**：账号密码登录换取 JWT，全部业务接口要求
      `Authorization: Bearer <token>`，当前用户身份完全来自令牌，不再信任任何请求头。

    ## 七、鉴权

    除 `POST /auth/login` 与 `/actuator/**` 外，所有接口都必须带
    `Authorization: Bearer <token>`：

    | 场景 | 返回码 | HTTP | 前端处理 |
    |---|---|---|---|
    | 未带令牌、令牌被吊销、令牌不合法 | `EC-40101` | 401 | 清除本地登录态，跳登录页 |
    | 令牌过期 | `EC-40102` | 401 | 同上，提示「登录已过期」 |
    | 账号被锁定（预留） | `EC-40103` | 401 | 提示稍后再试或联系管理员 |
    | 账号或密码错误 | `EC-40104` | 401 | 就地提示，停留登录页 |
    | 账号被停用 | `EC-40105` | 401 | 提示联系管理员 |

    令牌为 HS256 签名的 JWT，载荷含 `sub`（用户 ID）、`role`（STU/COU/ADMIN）、
    `grant`（是否有业务数据临时授权）、`name`（显示名）、`jti`、`iat`、`exp`；
    默认有效期 8 小时（`security.jwt.ttl-hours`），可在配置中调整。
    登出会把令牌的 `jti` 写入吊销名单，立即失效。

    角色判定仍在业务侧完成：`STU` 只能访问本人档案，`COU` 按 `org_class.counselor_user_id`
    判定本班，`ADMIN` 默认无业务数据权限，需 `sys_user.temp_grant = 1` 才可读取（`EC-40302`）。

    ## 八、审核

    六个板块共用同一套审核流程，接口路径不挂在板块下：

    | 步骤 | 接口 | 角色 | 状态变化 |
    |---|---|---|---|
    | 待审列表 | `GET /review/tasks` | 辅导员（只看本班）/ 持授权管理员 | 不变 |
    | 通过 | `POST /review/{code}/{studentId}/approve` | 该班现任辅导员 | `SUBMITTED → APPROVED` |
    | 退回 | `POST /review/{code}/{studentId}/reject` | 该班现任辅导员 | `SUBMITTED → RETURNED` |
    | 撤回 | `POST /sections/{code}/{studentId}/withdraw` | 学生本人 | `SUBMITTED → DRAFT` |

    审核权按 `org_class.counselor_user_id` 判定，非本班一律 `EC-40302`；
    通过/退回/撤回都会同时写 `arc_change_log` 与 `sys_audit_log`，并与业务同一事务（BR-S11）。
    六板块全部 `APPROVED` 时，`arc_profile.completed` 由审核流程置真（BR-S10）。

servers:
  - url: http://localhost:8080/api
    description: 本地后端（context-path 为 /api）

tags:
  - name: 基本信息
    description: 学籍与联系方式，板块编码 `basic`，字段前缀 `basic.`
  - name: 学业发展
    description: 学业目标、优势科目、能力自评，板块编码 `academic`，字段前缀 `academic.`
  - name: 兴趣特长
    description: 兴趣方向、特长技能、理想状态，板块编码 `interest`，字段前缀 `interest.`
  - name: 生活心理
    description: 组织任职、作息运动、压力与情绪，板块编码 `life`，字段前缀 `life.`
  - name: 职业规划
    description: 就业意向、目标行业岗位、实施计划，板块编码 `career`，字段前缀 `career.`
  - name: 导师寄语
    description: 导师谈话记录时间线，板块编码 `mentor`，字段前缀 `mentor.`；辅导员追加、学生反馈一次
  - name: 平台公共
    description: 统一响应结构与错误码
  - name: 管理员
    description: 管理员模式：按板块配置字段编辑权限；只配置权限，不修改档案内容

security:
  - bearerAuth: []

paths:
  /auth/login:
    post:
      tags: [平台公共]
      operationId: login
      security: []
      summary: 账号密码登录
      description: |
        用学号/工号与密码换取 JWT 令牌。本接口是唯一的匿名业务接口。

        校验失败一律返回 `EC-40104`，不区分「账号不存在」与「密码错误」，
        也不暴露账号是否存在；账号被停用返回 `EC-40105`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginDTO'
            example:
              username: '2024010101'
              password: Passw0rd!
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/me:
    get:
      tags: [平台公共]
      operationId: currentUser
      summary: 查询当前登录用户
      description: |
        返回令牌对应的用户信息，供前端刷新页面后恢复登录态。
        令牌失效时返回 `EC-40101` / `EC-40102`。
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/logout:
    post:
      tags: [平台公共]
      operationId: logout
      summary: 退出登录
      description: |
        把当前令牌的 `jti` 写入吊销名单（TTL 等于令牌剩余有效期），
        该令牌立即失效。重复登出或令牌已失效时仍返回成功，便于前端无脑清理本地状态。
      responses:
        '200':
          description: 已退出，无业务数据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoidResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /sections/{code}/{studentId}:
    get:
      tags: [平台公共]
      operationId: getSectionDetail
      summary: 查询板块详情
      description: |
        返回该学生指定学年该板块的详情，`fields` 为该板块已保存的字段值，
        `editable` 表示当前用户是否可编辑。字段是否可见、是否可编辑最终由
        `arc_field_def` 与档案状态共同决定。

        六个板块共用本接口，路径中的 `code` 决定板块。

        `code=mentor` 时返回结构仍是同一信封，但 `fields` 恒为空 Map：需求 4.7 规定本板块
        没有主表字段值，全部内容在 `arc_mentor_note` 子表。详情额外带 `notes`（按 `talkDate`
        倒序）与 `canAppend`；学生端的每条 `notes` 不含 `internalRemark` 与 `counselorId`。
      parameters:
        - $ref: '#/components/parameters/SectionCode'
        - $ref: '#/components/parameters/StudentId'
        - $ref: '#/components/parameters/AcademicYearQuery'
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SectionDetailResponse'
              examples:
                basic:
                  summary: 基本信息
                  value:
                    code: '0'
                    message: 操作成功
                    traceId: a1b2c3d4e5f60708
                    timestamp: '2026-11-26T15:23:50+08:00'
                    data:
                      studentId: 1001
                      academicYear: 2025-2026-1
                      sectionCode: BASIC
                      sectionName: 基本信息
                      status: DRAFT
                      fields:
                        name: 李明
                        studentNo: '2024010101'
                        gender: M
                        nation: 汉族
                        idCard: 320102********1232
                        nativePlace: 江苏 南京
                        dormNo: 3-412
                        classId: RJ2401
                        majorId: 软件工程
                        phone: 138****1234
                        email: 1001@example.edu.cn
                        emergencyContact: 李建国（父）
                        emergencyPhone: '139****1234'
                        photo: []
                        econLevel: NORMAL
                        familyStructure: ONLY_CHILD
                      fieldMeta:
                        - key: name
                          fieldCode: basic.name
                          fieldName: 姓名
                          fieldType: TEXT
                          required: true
                          source: SIS
                          editable: false
                          masked: false
                          pendingConfirm: false
                        - key: idCard
                          fieldCode: basic.idCard
                          fieldName: 身份证号
                          fieldType: TEXT
                          required: true
                          source: SIS
                          sensitive: 2
                          editable: false
                          masked: true
                          pendingConfirm: false
                        - key: phone
                          fieldCode: basic.phone
                          fieldName: 手机
                          fieldType: TEXT
                          required: false
                          source: STU_CFM
                          sensitive: 1
                          editable: true
                          masked: true
                          pendingConfirm: true
                          pendingValue: 139****5678
                      editable: true
                      completeness: 100.00
                      submitCount: 0
                      withdrawCount: 0
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '501':
          $ref: '#/components/responses/NotImplemented'

    put:
      tags: [平台公共]
      operationId: saveSectionDraft
      summary: 保存板块草稿
      description: |
        逐字段校验后写入，把板块保存为 `DRAFT`。
        仅 `DRAFT` / `RETURNED` 状态允许写入，其余状态返回 `EC-40902`。

        BASIC 请求体为 `{academicYear, fields}`：`fields` 的键是字段短名（如 `phone`），
        值与字段类型对应。字段的类型、必填、枚举、校验规则、可编辑角色全部来自
        `arc_field_def`，接口不再逐个声明——所以新增字段不需要改契约。

        未出现的字段按「不修改」处理，传 `null` 表示清空（必填项清空后无法提交）。
        学生首填、修改或清空 `STU_CFM` 字段均进入待确认区。fields 始终返回正式值；首填确认前为空。
        使用 fieldMeta.pendingConfirm 区分无申请与申请清空；清空申请的候选值为空（BR-F06）。

        `code=mentor` 例外：本板块没有主表字段值，`fields` 只允许为空对象；
        传非空字段返回 `EC-40003`，请改用 `POST /sections/mentor/{studentId}/notes`。
      parameters:
        - $ref: '#/components/parameters/SectionCode'
        - $ref: '#/components/parameters/StudentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              anyOf:
                - $ref: '#/components/schemas/BasicSectionSaveDTO'
                - $ref: '#/components/schemas/AcademicSectionSaveDTO'
                - $ref: '#/components/schemas/InterestSectionSaveDTO'
                - $ref: '#/components/schemas/LifeSectionSaveDTO'
                - $ref: '#/components/schemas/CareerSectionSaveDTO'
                - $ref: '#/components/schemas/MentorSectionSaveDTO'
            examples:
              basic:
                summary: 基本信息（code=basic）
                value:
                  academicYear: 2025-2026-1
                  fields:
                    phone: '13900005678'
                    email: 1001@example.edu.cn
                    emergencyContact: 李建国（父）
                    emergencyPhone: '13900001234'
              readonlyClass:
                summary: 学生修改学籍班级（预期 403 / EC-40301）
                value:
                  academicYear: 2025-2026-1
                  fields: {classId: RJ2402}
              academic:
                summary: 学业短期目标长度下界（20 字；该板块业务仍待实现）
                value:
                  academicYear: 2025-2026-1
                  goalShort: 本学期完成全部实验课程并按时提交学习报告
              academicTooShort:
                summary: 学业短期目标不足下界（19 字，DTO 校验反例）
                value:
                  academicYear: 2025-2026-1
                  goalShort: 本学期完成全部实验课程并按时提交学习报
      responses:
        '200':
          description: 保存成功，无业务数据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoidResponse'
              example:
                code: '0'
                message: 操作成功
                traceId: a1b2c3d4e5f60708
                timestamp: '2026-11-26T15:23:50+08:00'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /sections/{code}/{studentId}/submit:
    post:
      tags: [平台公共]
      operationId: submitSection
      summary: 提交板块
      description: |
        校验必填字段是否齐全，通过后把板块由 `DRAFT` / `RETURNED` 转为 `SUBMITTED`。
        学年通过 query 传入（与保存接口不同，保存接口的学年在请求体里）。
      parameters:
        - $ref: '#/components/parameters/SectionCode'
        - $ref: '#/components/parameters/StudentId'
        - name: academicYear
          in: query
          required: false
          description: 学年，格式 `2025-2026-1`；不传时取当前学年
          schema:
            type: string
            example: 2025-2026-1
      responses:
        '200':
          description: 提交成功，无业务数据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoidResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /sections/{code}/{studentId}/withdraw:
    post:
      tags: [平台公共]
      operationId: withdrawSection
      summary: 撤回提交
      description: |
        仅学生本人可撤回（`X-User-Id` 必须等于路径中的 `studentId`），`SUBMITTED` 转 `DRAFT`，
        `withdrawCount` 加一。全生命周期仅一次，第二次返回 `EC-40903`；非本人返回 `EC-40302`。

        撤回后板块恢复可编辑，撤回次数不因再次提交而重置。
      parameters:
        - $ref: '#/components/parameters/SectionCode'
        - $ref: '#/components/parameters/StudentId'
        - $ref: '#/components/parameters/AcademicYearQuery'
      responses:
        '200':
          description: 撤回成功，无业务数据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoidResponse'
              example:
                code: '0'
                message: 操作成功
                traceId: a1b2c3d4e5f60708
                timestamp: '2026-11-26T15:23:50+08:00'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /sections/mentor/{studentId}/notes:
    post:
      tags: [导师寄语]
      operationId: appendMentorNote
      summary: 追加一条谈话记录
      description: |
        仅该班现任辅导员可调用（`archive:mentor:append`），学生与管理员返回 `EC-40303` / `EC-40302`。
        需求 4.7：本板块没有主表字段值，全部内容在 `arc_mentor_note` 子表，一行一次谈话；
        **只可追加，不可编辑、不可删除**（BR-S07），发现记录有误时追加一条更正记录并注明「更正第 N 条」。

        板块实例（`arc_profile` 中的 MENTOR 行）不存在时自动创建为 DRAFT；`LOCKED` 状态拒绝追加。
        必填、长度、枚举、日期区间由 `arc_field_def` 与板块规则执行，错误码 `EC-42201` / `EC-42202`。
        追加后重算完成度并同时写 `arc_change_log` 与 `sys_audit_log`（与业务同一事务）。
      parameters:
        - $ref: '#/components/parameters/StudentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MentorNoteCreateDTO'
      responses:
        '200':
          description: 追加成功，返回该条记录的辅导员视角
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MentorNoteVO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'

  /sections/mentor/{studentId}/notes/{noteId}/feedback:
    post:
      tags: [导师寄语]
      operationId: submitMentorFeedback
      summary: 提交学生反馈
      description: |
        仅学生本人可调用（`archive:mentor:feedback`）。一条谈话只接受一条反馈，
        `feedback_at` 非空即锁定，**不随板块重提解锁**；重复提交返回 `EC-40902`。
        反馈不改变板块状态，也不写入主表字段值。
      parameters:
        - $ref: '#/components/parameters/StudentId'
        - name: noteId
          in: path
          required: true
          description: 谈话记录 ID
          schema:
            type: integer
            format: int64
            example: 5001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MentorFeedbackDTO'
      responses:
        '200':
          description: 提交成功，返回更新后的学生视角记录
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MentorNoteVO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'

  /sections/{code}/{studentId}/sync-student:
    post:
      tags: [基本信息]
      operationId: syncStudentFields
      summary: 从学工主数据重新同步基础字段
      description: |
        把学生主数据（`stu_student`）里的值**强制覆盖**到档案的基础字段：
        姓名、学号、性别、民族、身份证号、籍贯、班级（由 `arc_field_def.source_field` 声明映射）。

        与保存/提交时的自动补齐不同：自动补齐只填空值，本接口会改写已有值，
        用于学工系统改正数据后把新值推到档案。每次覆盖写一条
        `arc_change_log`（`source=IMPORT`、`operator_id=0`、`operator_role=SYS`），
        并写一条 `sys_audit_log`（`biz_type=IMPORT`、`action=SYNC`）。

        **权限**：本班现任辅导员，或持临时授权的管理员；其他人返回 `EC-40302`。
        **状态**：仅 `DRAFT` / `RETURNED` 可调用，已提交或已通过的档案返回 `EC-40902`——
        否则审核结论会被一次同步悄悄改掉。

        当前仅板块一（`code=basic`）实现，其余板块返回 `EC-50000`。
      parameters:
        - $ref: '#/components/parameters/SectionCode'
        - $ref: '#/components/parameters/StudentId'
        - $ref: '#/components/parameters/AcademicYearQuery'
      responses:
        '200':
          description: 同步完成，返回实际更新的字段数（0 表示主数据与档案已一致）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        type: integer
                        example: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /sections/{code}/{studentId}/fields/{fieldCode}/reveal:
    get:
      tags: [基本信息]
      operationId: revealSensitiveField
      summary: 查看敏感字段明文
      description: |
        仅辅导员（`X-User-Role: COU`）或持临时授权的管理员可调用；学生调用返回 `EC-40302`。
        调用即写审计日志（`arc_change_log.biz_type=REVIEW`），日志中不保存明文。

        当前仅板块一（`code=basic`）有敏感字段（`basic.idCard`），其余板块返回 `EC-40003`。
        该接口用于页面上的「查看完整」二次点击，列表与导出接口永远只给脱敏值。
      parameters:
        - $ref: '#/components/parameters/SectionCode'
        - $ref: '#/components/parameters/StudentId'
        - name: fieldCode
          in: path
          required: true
          description: 字段编码，含前缀，如 `basic.idCard`
          schema:
            type: string
            example: basic.idCard
        - $ref: '#/components/parameters/AcademicYearQuery'
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          fieldCode:
                            type: string
                            example: basic.idCard
                          fieldName:
                            type: string
                            example: 身份证号
                          value:
                            type: string
                            example: '320102200201011232'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /sections/{code}/{studentId}/fields/{fieldCode}/confirm:
    post:
      tags: [基本信息]
      operationId: confirmPendingField
      summary: 确认待确认值
      description: |
        学生修改 `STU_CFM` 类字段后，新值暂存于待确认区（`pending_*`），对外仍返回旧值。
        本接口由该班现任辅导员调用，把待确认值替换为正式值，并把 `confirmStatus` 置为 `APPROVED`。

        非本班辅导员、学生本人调用均返回 `EC-40302`；没有待确认值时返回 `EC-40902`。
        敏感字段的返回值已脱敏，查看明文仍需走 `reveal`（会写审计）。
      parameters:
        - $ref: '#/components/parameters/SectionCode'
        - $ref: '#/components/parameters/StudentId'
        - name: fieldCode
          in: path
          required: true
          description: 字段编码，含前缀，如 `basic.phone`
          schema:
            type: string
            example: basic.phone
        - $ref: '#/components/parameters/AcademicYearQuery'
      responses:
        '200':
          description: 确认成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PendingFieldVO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /sections/{code}/{studentId}/fields/{fieldCode}/reject:
    post:
      tags: [基本信息]
      operationId: rejectPendingField
      summary: 驳回待确认值
      description: |
        丢弃待确认区的新值，正式值保持不变，`confirmStatus` 置为 `REJECTED`。
        权限与状态要求同「确认待确认值」。
      parameters:
        - $ref: '#/components/parameters/SectionCode'
        - $ref: '#/components/parameters/StudentId'
        - name: fieldCode
          in: path
          required: true
          schema:
            type: string
            example: basic.phone
        - $ref: '#/components/parameters/AcademicYearQuery'
      responses:
        '200':
          description: 驳回成功，无业务数据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoidResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /review/tasks:
    get:
      tags: [审核]
      operationId: listReviewTasks
      summary: 待审列表
      description: |
        六个板块共用的待审列表。辅导员只能看到自己带班学生的板块（按 `org_class.counselor_user_id` 判定），
        管理员需持临时授权（`X-Temp-Grant: true`）才能查看；其他角色返回 `EC-40302`，不返回空列表。

        列表只返回任务摘要，打开详情仍走板块自己的 `GET /sections/{code}/{studentId}`。
      parameters:
        - name: sectionCode
          in: query
          required: false
          description: 板块编码，小写或大写均可；不传表示六个板块全查
          schema:
            type: string
            example: basic
        - name: status
          in: query
          required: false
          description: 板块状态，默认 `SUBMITTED`
          schema:
            type: string
            enum: [DRAFT, SUBMITTED, RETURNED, APPROVED, LOCKED]
            example: SUBMITTED
        - name: classId
          in: query
          required: false
          description: 班级编码，如 `RJ2401`；不传表示不限
          schema:
            type: string
            example: RJ2401
        - $ref: '#/components/parameters/AcademicYearQuery'
        - name: pageNum
          in: query
          required: false
          description: 页码，从 1 开始，默认 1
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          description: 每页条数，默认 20，最大 100
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ReviewTaskPage'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /review/{code}/{studentId}/approve:
    post:
      tags: [审核]
      operationId: approveSection
      summary: 审核通过
      description: |
        仅该班现任辅导员可操作（BR-S03），管理员与学生均返回 `EC-40302`。
        `SUBMITTED` 转 `APPROVED`，记录审核人与审核时间；状态不是 `SUBMITTED` 返回 `EC-40902`。
        启用字段有待确认申请时返回 EC-40902。非推导必填字段缺少正式值时返回 EC-42202。
        两种失败均保持 SUBMITTED，审核意见可空。
      parameters:
        - $ref: '#/components/parameters/SectionCode'
        - $ref: '#/components/parameters/StudentId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewDecisionDTO'
            example:
              academicYear: 2025-2026-1
              comment: 材料齐全，同意通过
      responses:
        '200':
          description: 审核成功，无业务数据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoidResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: 请先确认或驳回：紧急联系电话
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
              examples:
                pendingField:
                  value:
                    code: EC-40902
                    message: '请先确认或驳回：紧急联系电话'
                    traceId: a1b2c3d4e5f60708
                    timestamp: '2026-11-26T15:23:50+08:00'
        '422':
          description: 请退回补填：紧急联系电话
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
              examples:
                missingFormalValue:
                  value:
                    code: EC-42202
                    message: '请退回补填：紧急联系电话'
                    traceId: a1b2c3d4e5f60708
                    timestamp: '2026-11-26T15:23:50+08:00'
        '500':
          $ref: '#/components/responses/InternalError'

  /review/{code}/{studentId}/reject:
    post:
      tags: [审核]
      operationId: rejectSection
      summary: 审核退回
      description: |
        仅该班现任辅导员可操作，`SUBMITTED` 转 `RETURNED`。退回理由必填且不少于 10 字，
        理由对学生可见（写入 `arc_change_log.reason`）；不足 10 字返回 `EC-42203` 并带 `details`。
      parameters:
        - $ref: '#/components/parameters/SectionCode'
        - $ref: '#/components/parameters/StudentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewDecisionDTO'
            example:
              academicYear: 2025-2026-1
              reason: 紧急联系人电话与本人电话重复，请核对后重新提交
      responses:
        '200':
          description: 退回成功，无业务数据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoidResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'

  /profiles/classes:
    get:
      tags: [建档]
      operationId: listEnrollClasses
      summary: 可建档班级与建档进度
      description: |
        批量建档页（S-1-01）的班级清单。只返回当前登录辅导员带班的班级
        （按 `org_class.counselor_user_id` 判定），学生与管理员返回 `EC-40302`。

        “已建档”的口径是**六板块实例都已存在**，不要求已填写或已审核通过；
        本页只负责生成空档案，填写与审核进度见总览看板。
      parameters:
        - $ref: '#/components/parameters/AcademicYearQuery'
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ClassEnrollVO'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /profiles/batch-create:
    post:
      tags: [建档]
      operationId: batchCreateProfiles
      summary: 批量生成六板块空档案
      description: |
        按 `student_id × section_code × academic_year` 为所选班级的在读学生创建板块实例，
        状态为 `DRAFT`，每名学生六条（S-1-01）。

        - **幂等**：已存在的板块逐条跳过、不覆盖任何已填内容（EX-01），重复调用返回
          `createdProfiles = 0`，而不是报错；
        - **数据范围**：仅辅导员可调用，且只能处理本人带班班级；管理员为只读授权、
          学生不涉及，均返回 `EC-40302`；
        - **学生来源**：由服务端按学生主数据 `stu_student` 取在读学生，请求体不传学生 ID；
        - 单次最多 20 个班级 / 500 名学生，超出返回 `EC-40003`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchCreateDTO'
      responses:
        '200':
          description: 建档完成（可能全部跳过）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/BatchCreateResultVO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /archive/candidates:
    get:
      tags: [归档]
      operationId: listArchiveCandidates
      summary: 归档候选人与六板块完成情况
      description: |
        毕业归档页（S-1-11）的名单。辅导员只看到本班学生，管理员需持临时授权；
        其他角色返回 `EC-40302`。

        判定口径：六板块齐全且每块为 `APPROVED` 或 `LOCKED` 才 `archivable=true`；
        已归档也计入完成，否则重复提交同一批名单会永远被判为未完成。
        未建档学生同样会出现在名单里（`sectionCount = 0`），避免「根本没开始」的人从列表消失。
      parameters:
        - $ref: '#/components/parameters/AcademicYearQuery'
        - name: classCode
          in: query
          required: false
          description: 班级编码；不传表示本人全部带班班级
          schema:
            type: string
            example: DZ2401
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ArchiveCandidateVO'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /archive/batch:
    post:
      tags: [归档]
      operationId: archiveBatch
      summary: 批量归档
      description: |
        六板块全部通过后整体转 `LOCKED`（终态，仅 ADMIN 可解冻），并逐块写 `ARCHIVE` 变更日志。

        - **整批语义（EX-12）**：名单内只要有一名学生存在未完成板块，整批不执行，
          `rejected = true`，`students` 返回未完成清单，`archivedStudents = 0`；
        - 结果用 200 返回而不是 409：拒绝原因是一份清单，压成错误字符串会丢结构，
          错误码只用于真正的非法请求（400/403/409 乐观锁）；
        - 已归档学生按跳过处理（`skippedStudents`），不重复写库；
        - 仅辅导员可调用，且只能归档本班学生；单批最多 200 人。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArchiveBatchDTO'
      responses:
        '200':
          description: 归档结果（可能被整批拒绝）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ArchiveResultVO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /completion/students/{studentId}:
    get:
      tags: [完成标记]
      operationId: getCompletionStatus
      summary: 读取学生六板块完成标记
      description: |
        完成标记（BR-S10）是「学生 × 学年」级别的派生结论：六个板块全部处于 `APPROVED`
        或 `LOCKED` 时为 `true`，由服务端写入 `arc_profile.completed`，客户端不得自行统计。

        已归档（`LOCKED`）也算完成——归档是完成之后的终态，不能因为归档把标记算回未完成。

        数据范围：学生只能读本人，辅导员只能读本班学生，管理员需持临时授权；越权返回 `EC-40302`。
        逐板块列表固定六项，未建档板块的 `status` 为空、`statusLabel` 为「未建档」。
      parameters:
        - $ref: '#/components/parameters/StudentId'
        - $ref: '#/components/parameters/AcademicYearQuery'
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CompletionStatusVO'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /completion/refresh:
    post:
      tags: [完成标记]
      operationId: refreshCompletion
      summary: 手动重算完成标记
      description: |
        运维补偿接口：正常路径上，提交 / 撤回 / 审核通过 / 退回都会在事务内重算标记，
        只有绕过状态机的旁路数据（直接改库、批量修数脚本、迁移导入）才需要手工触发。

        不传 `studentId` 表示整学年重算，仅持临时授权的管理员可执行；辅导员只能重算本班单个学生；
        学生一律 `EC-40302`。重算是幂等的：标记未翻转时不写库，`changedStudents` 为 0。
        每次调用写一条 `COMPLETION` 类型审计日志。
      parameters:
        - name: studentId
          in: query
          required: false
          description: 学生 ID；不传表示整学年重算（仅管理员）
          schema:
            type: integer
            format: int64
            example: 1001
        - $ref: '#/components/parameters/AcademicYearQuery'
      responses:
        '200':
          description: 重算完成
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CompletionRefreshVO'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /dashboard/overview:
    get:
      tags: [总览]
      operationId: getDashboardOverview
      summary: 首页进度聚合
      description: |
        一个请求返回首页所需的全部数字：建档学生数、六板块完成数、待审核量、
        六板块状态分布与班级完成率。前端不要再用分项自己推导总数，否则两端口径会漂。

        口径为「本学年已建档」：未建档学生没有 `arc_profile` 记录，不计入分母。
        「完成」读 `arc_profile.completed`（由 S-1-10 维护），不在查询时重算六板块规则。

        数据范围由服务端按角色收口：辅导员只统计自己的带班（并按 `org_class.counselor_user_id` 过滤），
        管理员需持临时授权；学生与无授权管理员返回 `EC-40302`。
      parameters:
        - $ref: '#/components/parameters/AcademicYearQuery'
        - name: classCode
          in: query
          required: false
          description: |
            班级编码，用于单班视角。辅导员传他班编码返回 `EC-40302`；
            班级不存在返回 `EC-40003`。
          schema:
            type: string
            example: RJ2401
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/DashboardOverviewVO'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/permissions:
    get:
      tags: [管理员]
      operationId: getFieldPermissionMatrix
      summary: 读取六大板块字段权限矩阵
      description: |
        管理员模式的权限配置入口：返回六个板块全部启用字段的当前可编辑角色、
        初始化默认值、是否固定只读，以及按角色统计的可编辑字段数。

        本接口只读 `arc_field_def`，不读取任何学生档案内容——配置权限的过程不应接触业务数据。
        仅 `ADMIN` 可调用，学生与辅导员返回 `EC-40303`。
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PermissionMatrixVO'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/permissions/{sectionCode}:
    put:
      tags: [管理员]
      operationId: saveFieldPermissions
      summary: 保存某板块的字段编辑权限
      description: |
        按板块整批保存，一次事务内要么全部生效、要么全部不生效。写入
        `arc_field_def.editable_roles` 后立即生效：六个板块的详情接口按同一列计算
        `editable`，保存接口按同一列做越权校验（`EC-40301`），不需要刷新缓存。

        约束：
        1. 仅 `ADMIN` 可调用，其他角色返回 `EC-40303`；
        2. 可编辑角色只能是 `STU` / `COU`，传 `ADMIN` 返回 `EC-40003`——管理员只配置权限，不编辑内容；
        3. 系统推导（`majorId`）、系统生成（`source=SYS`）与学号等固定只读字段不允许配置；
        4. 字段对该角色不可见（如仅辅导员可见的 `mentor.internalRemark`）时，不允许配成该角色可编辑，返回 `EC-40003`；
        5. 只对发生变化的字段写库并记审计，未变化的字段不产生日志。
      parameters:
        - name: sectionCode
          in: path
          required: true
          description: 板块编码，大小写均可
          schema:
            type: string
            enum: [basic, academic, interest, life, career, mentor]
            example: basic
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PermissionSaveDTO'
      responses:
        '200':
          description: 保存成功，返回实际变更数与保存后的板块快照
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PermissionSaveResultVO'
        '400':
          description: 参数非法，`code` 为 `EC-40002` / `EC-40003`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoidResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/permissions/{sectionCode}/reset:
    post:
      tags: [管理员]
      operationId: resetFieldPermissions
      summary: 恢复某板块的默认字段编辑权限
      description: |
        把该板块全部字段的可编辑角色恢复为初始化口径（`default_editable_roles`）。
        与保存接口一样仅 `ADMIN` 可调用；恢复后立即生效，并按字段写 `RESET` 审计。
      parameters:
        - name: sectionCode
          in: path
          required: true
          description: 板块编码，大小写均可
          schema:
            type: string
            enum: [basic, academic, interest, life, career, mentor]
            example: basic
      responses:
        '200':
          description: 恢复成功，返回实际变更数与恢复后的板块快照
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PermissionSaveResultVO'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'


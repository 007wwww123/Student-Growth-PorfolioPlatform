openapi: 3.0.3

info:
  title: 学生成长档案平台 API
  version: 0.1.0
  license:
    name: 内部项目，未授予开源许可
  description: |
    学生成长档案平台后端接口契约。依据《一期建设总流程与可执行方案》第 9.1 节工程约定与
    第 6.1 节错误响应结构编写，代码实现见 `backend/src/main/java/com/college/growth`。

    ## 一、统一响应体

    所有接口一律返回 `Result` 包装，HTTP 状态码只表达传输层结果，业务原因由 `code` 表达：

    ```json
    {
      "code": "0",
      "message": "操作成功",
      "traceId": "a1b2c3d4e5f60708",
      "timestamp": "2026-11-26T15:23:50+08:00",
      "data": {},
      "details": []
    }
    ```

    - `code` 为 `"0"` 表示成功，其余为 `EC-xxxxx` 业务码；
    - `data` 仅在成功且存在业务数据时出现（后端按 `non_null` 序列化）；
    - `details` 仅在字段校验失败（`EC-42201`）时出现，供前端逐字段提示；
    - `traceId` 用于串联服务端日志，用户报障时请一并提供。

    ## 二、板块数据结构：信封 + fields

    六大板块共用「公共信封 + 动态字段」结构，板块自身字段放在 `fields` 内：

    ```json
    {
      "studentId": 1001,
      "academicYear": "2025-2026-1",
      "sectionCode": "BASIC",
      "sectionName": "基本信息",
      "status": "DRAFT",
      "fields": { "name": "林清和", "studentNo": "2023010101" },
      "editable": true
    }
    ```

    这样后端可按 `arc_field_def` 动态下发字段（需求文档 4.1），前端表单跟着 `fields` 渲染，
    新增字段不需要改动页面结构。**不要**把板块字段平铺到信封外层，也**不要**再套一层
    `{ basic: {...}, academic: {...} }`。

    ## 三、路径与命名

    - 接口前缀为后端 `server.servlet.context-path`，即 `/api`，本文件中 `servers.url` 已包含；
    - 路径中的板块编码**用小写**（`basic` / `academic` / `interest` / `life` / `career` /
      `mentor`），与 `SectionCodeEnum.code` 一致；
    - 响应体中的 `sectionCode` **用大写**（`BASIC` 等），与 `SectionCodeEnum.name` 一致；
    - 请求与响应字段一律 lowerCamelCase，与各板块 `SaveDTO` / `VO` 属性名一致。

    ## 四、档案状态

    `DRAFT` 草稿 → `SUBMITTED` 已提交 → `APPROVED` 已通过 → `LOCKED` 已归档，
    `SUBMITTED` 可被退回为 `RETURNED`，`RETURNED` 可再次提交。
    **仅 `DRAFT` 与 `RETURNED` 允许保存与提交**，其余状态返回 `EC-40902`。
    `SUBMITTED` 可由学生本人撤回为 `DRAFT`（全生命周期一次），
    也可由该班现任辅导员通过或退回；审核接口见 `## 八、审核`。

    ## 五、错误码

    `EC-` 加五位数字，前三位表示类别，后两位为序号。

    | 业务码 | HTTP | 含义 | 前端建议处理 |
    |---|---|---|---|
    | `EC-40001` | 400 | 请求格式不正确 | 提示刷新重试 |
    | `EC-40002` | 400 | 缺少必要参数 | 检查必传参数 |
    | `EC-40003` | 400 | 参数超出允许范围 | 检查板块编码、ID 格式 |
    | `EC-40101` | 401 | 登录已失效 | 跳转登录 |
    | `EC-40102` | 401 | 登录已过期 | 跳转登录 |
    | `EC-40103` | 401 | 账号被锁定（预留） | 提示稍后再试或联系管理员 |
    | `EC-40104` | 401 | 账号或密码错误 | 就地提示，停留登录页 |
    | `EC-40105` | 401 | 账号被停用 | 提示联系管理员 |
    | `EC-40301` | 403 | 字段由学校维护，不可修改 | 置灰该字段 |
    | `EC-40302` | 403 | 无权访问该学生档案 | 提示无权限 |
    | `EC-40902` | 409 | 当前状态不允许该操作 | 刷新详情后重试 |
    | `EC-40903` | 409 | 撤回次数已用完 | 提示不可撤回 |
    | `EC-40907` | 409 | 内容已被他人修改（乐观锁冲突） | 提示刷新后重试 |
    | `EC-42201` | 422 | 字段校验未通过 | 按 `details` 逐字段提示 |
    | `EC-42202` | 422 | 必填内容未填写 | 按 `details` 定位字段 |
    | `EC-42203` | 422 | 退回理由不少于 10 字 | 提示补足字数 |
    | `EC-50000` | 501 | 该功能尚未实现 | 骨架期占位，提示稍后再试 |
    | `EC-50001` | 500 | 系统繁忙 | 提示稍后重试，附 traceId |
    | `EC-50002` | 500 | 文件服务不可用 | 提示稍后重试 |
    | `EC-50003` | 500 | 档案生成失败 | 联系管理员 |

    ## 六、当前实现状态

    - **板块一（basic）后端已闭环**：详情、保存、提交、撤回、待确认字段确认/驳回、敏感字段查看。
      字段定义来自 `arc_field_def`，初始化脚本见
      `backend/src/main/resources/db/sql/03_insert_basic_field_defs.sql`（16 个字段）。
    - **审核模块已独立成公共模块**（`com.college.growth.review`）：待审列表、通过、退回，
      六个板块共用一套状态机与一套接口；板块一通过公共状态机流转，不重复实现审核逻辑。
    - 其余五个板块仍为骨架：路由与 DTO 已就位，Service 返回 `EC-50000`（HTTP 501）。
    - **登录鉴权已接入**：账号密码登录换取 JWT，全部业务接口要求
      `Authorization: Bearer <token>`，当前用户身份完全来自令牌，不再信任任何请求头。

    ## 七、鉴权

    除 `POST /auth/login` 与 `/actuator/**` 外，所有接口都必须带
    `Authorization: Bearer <token>`：

    | 场景 | 返回码 | HTTP | 前端处理 |
    |---|---|---|---|
    | 未带令牌、令牌被吊销、令牌不合法 | `EC-40101` | 401 | 清除本地登录态，跳登录页 |
    | 令牌过期 | `EC-40102` | 401 | 同上，提示「登录已过期」 |
    | 账号被锁定（预留） | `EC-40103` | 401 | 提示稍后再试或联系管理员 |
    | 账号或密码错误 | `EC-40104` | 401 | 就地提示，停留登录页 |
    | 账号被停用 | `EC-40105` | 401 | 提示联系管理员 |

    令牌为 HS256 签名的 JWT，载荷含 `sub`（用户 ID）、`role`（STU/COU/ADMIN）、
    `grant`（是否有业务数据临时授权）、`name`（显示名）、`jti`、`iat`、`exp`；
    默认有效期 8 小时（`security.jwt.ttl-hours`），可在配置中调整。
    登出会把令牌的 `jti` 写入吊销名单，立即失效。

    角色判定仍在业务侧完成：`STU` 只能访问本人档案，`COU` 按 `org_class.counselor_user_id`
    判定本班，`ADMIN` 默认无业务数据权限，需 `sys_user.temp_grant = 1` 才可读取（`EC-40302`）。

    ## 八、审核

    六个板块共用同一套审核流程，接口路径不挂在板块下：

    | 步骤 | 接口 | 角色 | 状态变化 |
    |---|---|---|---|
    | 待审列表 | `GET /review/tasks` | 辅导员（只看本班）/ 持授权管理员 | 不变 |
    | 通过 | `POST /review/{code}/{studentId}/approve` | 该班现任辅导员 | `SUBMITTED → APPROVED` |
    | 退回 | `POST /review/{code}/{studentId}/reject` | 该班现任辅导员 | `SUBMITTED → RETURNED` |
    | 撤回 | `POST /sections/{code}/{studentId}/withdraw` | 学生本人 | `SUBMITTED → DRAFT` |

    审核权按 `org_class.counselor_user_id` 判定，非本班一律 `EC-40302`；
    通过/退回/撤回都会同时写 `arc_change_log` 与 `sys_audit_log`，并与业务同一事务（BR-S11）。
    六板块全部 `APPROVED` 时，`arc_profile.completed` 由审核流程置真（BR-S10）。

servers:
  - url: http://localhost:8080/api
    description: 本地后端（context-path 为 /api）

tags:
  - name: 基本信息
    description: 学籍与联系方式，板块编码 `basic`，字段前缀 `basic.`
  - name: 学业发展
    description: 学业目标、优势科目、能力自评，板块编码 `academic`，字段前缀 `academic.`
  - name: 兴趣特长
    description: 兴趣方向、特长技能、理想状态，板块编码 `interest`，字段前缀 `interest.`
  - name: 生活心理
    description: 组织任职、作息运动、压力与情绪，板块编码 `life`，字段前缀 `life.`
  - name: 职业规划
    description: 就业意向、目标行业岗位、实施计划，板块编码 `career`，字段前缀 `career.`
  - name: 导师寄语
    description: 导师谈话记录与建议，板块编码 `mentor`，字段前缀 `mentor.`；学生只读
  - name: 平台公共
    description: 统一响应结构与错误码

security:
  - bearerAuth: []

paths:
  /auth/login:
    post:
      tags: [平台公共]
      operationId: login
      security: []
      summary: 账号密码登录
      description: |
        用学号/工号与密码换取 JWT 令牌。本接口是唯一的匿名业务接口。

        校验失败一律返回 `EC-40104`，不区分「账号不存在」与「密码错误」，
        也不暴露账号是否存在；账号被停用返回 `EC-40105`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginDTO'
            example:
              username: '2023010101'
              password: Passw0rd!
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/me:
    get:
      tags: [平台公共]
      operationId: currentUser
      summary: 查询当前登录用户
      description: |
        返回令牌对应的用户信息，供前端刷新页面后恢复登录态。
        令牌失效时返回 `EC-40101` / `EC-40102`。
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/logout:
    post:
      tags: [平台公共]
      operationId: logout
      summary: 退出登录
      description: |
        把当前令牌的 `jti` 写入吊销名单（TTL 等于令牌剩余有效期），
        该令牌立即失效。重复登出或令牌已失效时仍返回成功，便于前端无脑清理本地状态。
      responses:
        '200':
          description: 已退出，无业务数据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoidResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /sections/{code}/{studentId}:
    get:
      tags: [平台公共]
      operationId: getSectionDetail
      summary: 查询板块详情
      description: |
        返回该学生指定学年该板块的详情，`fields` 为该板块已保存的字段值，
        `editable` 表示当前用户是否可编辑。字段是否可见、是否可编辑最终由
        `arc_field_def` 与档案状态共同决定。

        六个板块共用本接口，路径中的 `code` 决定板块。
      parameters:
        - $ref: '#/components/parameters/SectionCode'
        - $ref: '#/components/parameters/StudentId'
        - $ref: '#/components/parameters/AcademicYearQuery'
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SectionDetailResponse'
              examples:
                basic:
                  summary: 基本信息
                  value:
                    code: '0'
                    message: 操作成功
                    traceId: a1b2c3d4e5f60708
                    timestamp: '2026-11-26T15:23:50+08:00'
                    data:
                      studentId: 1001
                      academicYear: 2025-2026-1
                      sectionCode: BASIC
                      sectionName: 基本信息
                      status: DRAFT
                      fields:
                        name: 林清和
                        studentNo: '2023010101'
                        gender: F
                        nation: 汉族
                        idCard: 330106********0012
                        nativePlace: 浙江 杭州
                        dormNo: 3-412
                        classId: RJ2401
                        majorId: 软件工程
                        phone: 138****1234
                        email: linqinghe@example.edu.cn
                        emergencyContact: 林建国（父）
                        emergencyPhone: '13900001234'
                        photo: [10231]
                        econLevel: NORMAL
                        familyStructure: ONLY_CHILD
                      fieldMeta:
                        - key: name
                          fieldCode: basic.name
                          fieldName: 姓名
                          fieldType: TEXT
                          required: true
                          source: SIS
                          editable: false
                          masked: false
                          pendingConfirm: false
                        - key: idCard
                          fieldCode: basic.idCard
                          fieldName: 身份证号
                          fieldType: TEXT
                          required: true
                          source: SIS
                          sensitive: 2
                          editable: false
                          masked: true
                          pendingConfirm: false
                        - key: phone
                          fieldCode: basic.phone
                          fieldName: 手机
                          fieldType: TEXT
                          required: false
                          source: STU_CFM
                          sensitive: 1
                          editable: true
                          masked: true
                          pendingConfirm: true
                          pendingValue: 139****5678
                      editable: true
                      completeness: 62.50
                      submitCount: 0
                      withdrawCount: 0
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '501':
          $ref: '#/components/responses/NotImplemented'

    put:
      tags: [平台公共]
      operationId: saveSectionDraft
      summary: 保存板块草稿
      description: |
        逐字段校验后写入，把板块保存为 `DRAFT`。
        仅 `DRAFT` / `RETURNED` 状态允许写入，其余状态返回 `EC-40902`。

        请求体为 `{academicYear, fields}`：`fields` 的键是字段短名（如 `phone`），
        值与字段类型对应。字段的类型、必填、枚举、校验规则、可编辑角色全部来自
        `arc_field_def`，接口不再逐个声明——所以新增字段不需要改契约。

        未出现的字段按「不修改」处理，传 `null` 表示清空（必填项清空后无法提交）。
        `STU_CFM` 类字段由学生修改时进入待确认区，辅导员确认前仍返回旧值（BR-F06）。
      parameters:
        - $ref: '#/components/parameters/SectionCode'
        - $ref: '#/components/parameters/StudentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/BasicSectionSaveDTO'
                - $ref: '#/components/schemas/AcademicSectionSaveDTO'
                - $ref: '#/components/schemas/InterestSectionSaveDTO'
                - $ref: '#/components/schemas/LifeSectionSaveDTO'
                - $ref: '#/components/schemas/CareerSectionSaveDTO'
                - $ref: '#/components/schemas/MentorSectionSaveDTO'
            examples:
              basic:
                summary: 基本信息（code=basic）
                value:
                  academicYear: 2025-2026-1
                  fields:
                    classId: RJ2401
                    phone: '13900005678'
                    email: linqinghe@example.edu.cn
                    emergencyContact: 林建国（父）
                    emergencyPhone: '13900001234'
                    photo: [10231]
              academic:
                summary: 学业发展（code=academic）
                value:
                  academicYear: 2025-2026-1
                  goalShort: 本学期绩点进入专业前 15%
                  goalLong: 争取保研，进入数据分析方向
                  strongSubjects: [数据结构, 概率论]
                  weakSubjects: [大学物理]
                  abilityNote: 编程实现能力较强，理论推导需要加强。
      responses:
        '200':
          description: 保存成功，无业务数据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoidResponse'
              example:
                code: '0'
                message: 操作成功
                traceId: a1b2c3d4e5f60708
                timestamp: '2026-11-26T15:23:50+08:00'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /sections/{code}/{studentId}/submit:
    post:
      tags: [平台公共]
      operationId: submitSection
      summary: 提交板块
      description: |
        校验必填字段是否齐全，通过后把板块由 `DRAFT` / `RETURNED` 转为 `SUBMITTED`。
        学年通过 query 传入（与保存接口不同，保存接口的学年在请求体里）。
      parameters:
        - $ref: '#/components/parameters/SectionCode'
        - $ref: '#/components/parameters/StudentId'
        - name: academicYear
          in: query
          required: false
          description: 学年，格式 `2025-2026-1`；不传时取当前学年
          schema:
            type: string
            example: 2025-2026-1
      responses:
        '200':
          description: 提交成功，无业务数据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoidResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /sections/{code}/{studentId}/withdraw:
    post:
      tags: [平台公共]
      operationId: withdrawSection
      summary: 撤回提交
      description: |
        仅学生本人可撤回（`X-User-Id` 必须等于路径中的 `studentId`），`SUBMITTED` 转 `DRAFT`，
        `withdrawCount` 加一。全生命周期仅一次，第二次返回 `EC-40903`；非本人返回 `EC-40302`。

        撤回后板块恢复可编辑，撤回次数不因再次提交而重置。
      parameters:
        - $ref: '#/components/parameters/SectionCode'
        - $ref: '#/components/parameters/StudentId'
        - $ref: '#/components/parameters/AcademicYearQuery'
      responses:
        '200':
          description: 撤回成功，无业务数据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoidResponse'
              example:
                code: '0'
                message: 操作成功
                traceId: a1b2c3d4e5f60708
                timestamp: '2026-11-26T15:23:50+08:00'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /sections/{code}/{studentId}/sync-student:
    post:
      tags: [基本信息]
      operationId: syncStudentFields
      summary: 从学工主数据重新同步基础字段
      description: |
        把学生主数据（`stu_student`）里的值**强制覆盖**到档案的基础字段：
        姓名、学号、性别、民族、身份证号、籍贯、班级（由 `arc_field_def.source_field` 声明映射）。

        与保存/提交时的自动补齐不同：自动补齐只填空值，本接口会改写已有值，
        用于学工系统改正数据后把新值推到档案。每次覆盖写一条
        `arc_change_log`（`source=IMPORT`、`operator_id=0`、`operator_role=SYS`），
        并写一条 `sys_audit_log`（`biz_type=IMPORT`、`action=SYNC`）。

        **权限**：本班现任辅导员，或持临时授权的管理员；其他人返回 `EC-40302`。
        **状态**：仅 `DRAFT` / `RETURNED` 可调用，已提交或已通过的档案返回 `EC-40902`——
        否则审核结论会被一次同步悄悄改掉。

        当前仅板块一（`code=basic`）实现，其余板块返回 `EC-50000`。
      parameters:
        - $ref: '#/components/parameters/SectionCode'
        - $ref: '#/components/parameters/StudentId'
        - $ref: '#/components/parameters/AcademicYearQuery'
      responses:
        '200':
          description: 同步完成，返回实际更新的字段数（0 表示主数据与档案已一致）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        type: integer
                        example: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /sections/{code}/{studentId}/fields/{fieldCode}/reveal:
    get:
      tags: [基本信息]
      operationId: revealSensitiveField
      summary: 查看敏感字段明文
      description: |
        仅辅导员（`X-User-Role: COU`）或持临时授权的管理员可调用；学生调用返回 `EC-40302`。
        调用即写审计日志（`arc_change_log.biz_type=REVIEW`），日志中不保存明文。

        当前仅板块一（`code=basic`）有敏感字段（`basic.idCard`），其余板块返回 `EC-40003`。
        该接口用于页面上的「查看完整」二次点击，列表与导出接口永远只给脱敏值。
      parameters:
        - $ref: '#/components/parameters/SectionCode'
        - $ref: '#/components/parameters/StudentId'
        - name: fieldCode
          in: path
          required: true
          description: 字段编码，含前缀，如 `basic.idCard`
          schema:
            type: string
            example: basic.idCard
        - $ref: '#/components/parameters/AcademicYearQuery'
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          fieldCode:
                            type: string
                            example: basic.idCard
                          fieldName:
                            type: string
                            example: 身份证号
                          value:
                            type: string
                            example: '330106200401010012'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /sections/{code}/{studentId}/fields/{fieldCode}/confirm:
    post:
      tags: [基本信息]
      operationId: confirmPendingField
      summary: 确认待确认值
      description: |
        学生修改 `STU_CFM` 类字段后，新值暂存于待确认区（`pending_*`），对外仍返回旧值。
        本接口由该班现任辅导员调用，把待确认值替换为正式值，并把 `confirmStatus` 置为 `APPROVED`。

        非本班辅导员、学生本人调用均返回 `EC-40302`；没有待确认值时返回 `EC-40902`。
        敏感字段的返回值已脱敏，查看明文仍需走 `reveal`（会写审计）。
      parameters:
        - $ref: '#/components/parameters/SectionCode'
        - $ref: '#/components/parameters/StudentId'
        - name: fieldCode
          in: path
          required: true
          description: 字段编码，含前缀，如 `basic.phone`
          schema:
            type: string
            example: basic.phone
        - $ref: '#/components/parameters/AcademicYearQuery'
      responses:
        '200':
          description: 确认成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PendingFieldVO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /sections/{code}/{studentId}/fields/{fieldCode}/reject:
    post:
      tags: [基本信息]
      operationId: rejectPendingField
      summary: 驳回待确认值
      description: |
        丢弃待确认区的新值，正式值保持不变，`confirmStatus` 置为 `REJECTED`。
        权限与状态要求同「确认待确认值」。
      parameters:
        - $ref: '#/components/parameters/SectionCode'
        - $ref: '#/components/parameters/StudentId'
        - name: fieldCode
          in: path
          required: true
          schema:
            type: string
            example: basic.phone
        - $ref: '#/components/parameters/AcademicYearQuery'
      responses:
        '200':
          description: 驳回成功，无业务数据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoidResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /review/tasks:
    get:
      tags: [审核]
      operationId: listReviewTasks
      summary: 待审列表
      description: |
        六个板块共用的待审列表。辅导员只能看到自己带班学生的板块（按 `org_class.counselor_user_id` 判定），
        管理员需持临时授权（`X-Temp-Grant: true`）才能查看；其他角色返回 `EC-40302`，不返回空列表。

        列表只返回任务摘要，打开详情仍走板块自己的 `GET /sections/{code}/{studentId}`。
      parameters:
        - name: sectionCode
          in: query
          required: false
          description: 板块编码，小写或大写均可；不传表示六个板块全查
          schema:
            type: string
            example: basic
        - name: status
          in: query
          required: false
          description: 板块状态，默认 `SUBMITTED`
          schema:
            type: string
            enum: [DRAFT, SUBMITTED, RETURNED, APPROVED, LOCKED]
            example: SUBMITTED
        - name: classId
          in: query
          required: false
          description: 班级编码，如 `RJ2401`；不传表示不限
          schema:
            type: string
            example: RJ2401
        - $ref: '#/components/parameters/AcademicYearQuery'
        - name: pageNum
          in: query
          required: false
          description: 页码，从 1 开始，默认 1
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          description: 每页条数，默认 20，最大 100
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ReviewTaskPage'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /review/{code}/{studentId}/approve:
    post:
      tags: [审核]
      operationId: approveSection
      summary: 审核通过
      description: |
        仅该班现任辅导员可操作（BR-S03），管理员与学生均返回 `EC-40302`。
        `SUBMITTED` 转 `APPROVED`，记录审核人与审核时间；状态不是 `SUBMITTED` 返回 `EC-40902`。
        审核意见可空。
      parameters:
        - $ref: '#/components/parameters/SectionCode'
        - $ref: '#/components/parameters/StudentId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewDecisionDTO'
            example:
              academicYear: 2025-2026-1
              comment: 材料齐全，同意通过
      responses:
        '200':
          description: 审核成功，无业务数据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoidResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'

  /review/{code}/{studentId}/reject:
    post:
      tags: [审核]
      operationId: rejectSection
      summary: 审核退回
      description: |
        仅该班现任辅导员可操作，`SUBMITTED` 转 `RETURNED`。退回理由必填且不少于 10 字，
        理由对学生可见（写入 `arc_change_log.reason`）；不足 10 字返回 `EC-42203` 并带 `details`。
      parameters:
        - $ref: '#/components/parameters/SectionCode'
        - $ref: '#/components/parameters/StudentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewDecisionDTO'
            example:
              academicYear: 2025-2026-1
              reason: 紧急联系人电话与本人电话重复，请核对后重新提交
      responses:
        '200':
          description: 退回成功，无业务数据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoidResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'

  /profiles/classes:
    get:
      tags: [建档]
      operationId: listEnrollClasses
      summary: 可建档班级与建档进度
      description: |
        批量建档页（S-1-01）的班级清单。只返回当前登录辅导员带班的班级
        （按 `org_class.counselor_user_id` 判定），学生与管理员返回 `EC-40302`。

        “已建档”的口径是**六板块实例都已存在**，不要求已填写或已审核通过；
        本页只负责生成空档案，填写与审核进度见总览看板。
      parameters:
        - $ref: '#/components/parameters/AcademicYearQuery'
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ClassEnrollVO'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /profiles/batch-create:
    post:
      tags: [建档]
      operationId: batchCreateProfiles
      summary: 批量生成六板块空档案
      description: |
        按 `student_id × section_code × academic_year` 为所选班级的在读学生创建板块实例，
        状态为 `DRAFT`，每名学生六条（S-1-01）。

        - **幂等**：已存在的板块逐条跳过、不覆盖任何已填内容（EX-01），重复调用返回
          `createdProfiles = 0`，而不是报错；
        - **数据范围**：仅辅导员可调用，且只能处理本人带班班级；管理员为只读授权、
          学生不涉及，均返回 `EC-40302`；
        - **学生来源**：由服务端按学生主数据 `stu_student` 取在读学生，请求体不传学生 ID；
        - 单次最多 20 个班级 / 500 名学生，超出返回 `EC-40003`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchCreateDTO'
      responses:
        '200':
          description: 建档完成（可能全部跳过）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/BatchCreateResultVO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        登录后返回的 JWT，放在 `Authorization: Bearer <token>` 中。
        除 `POST /auth/login` 与 `/actuator/**` 外，所有接口都必须携带。

  parameters:
    SectionCode:
      name: code
      in: path
      required: true
      description: 板块编码，小写，与 `SectionCodeEnum.code` 一致
      schema:
        type: string
        enum: [basic, academic, interest, life, career, mentor]
    StudentId:
      name: studentId
      in: path
      required: true
      description: 学生 ID，正整数
      schema:
        type: integer
        format: int64
        minimum: 1
        example: 1001
    AcademicYearQuery:
      name: academicYear
      in: query
      required: false
      description: 学年，格式 `2025-2026-1`；不传时取当前学年
      schema:
        type: string
        example: 2025-2026-1

  responses:
    Unauthorized:
      description: 未登录或登录失效，`code` 为 `EC-40101` / `EC-40102` / `EC-40104`
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/VoidResponse'
          example:
            code: EC-40101
            message: 登录已失效，请重新登录
            traceId: a1b2c3d4e5f60708
            timestamp: '2026-11-26T15:23:50+08:00'
    BadRequest:
      description: 参数错误，`code` 为 `EC-40001` / `EC-40002` / `EC-40003`
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/VoidResponse'
    Forbidden:
      description: 无权限，`code` 为 `EC-40301` / `EC-40302`
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/VoidResponse'
    Conflict:
      description: 状态冲突，`code` 为 `EC-40902` / `EC-40903`
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/VoidResponse'
          example:
            code: EC-40902
            message: 当前状态不允许该操作
            traceId: a1b2c3d4e5f60708
            timestamp: '2026-11-26T15:23:50+08:00'
    ValidationFailed:
      description: 字段校验失败，`code` 为 `EC-42201`
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
          example:
            code: EC-42201
            message: 字段校验未通过
            traceId: a1b2c3d4e5f60708
            timestamp: '2026-11-26T15:23:50+08:00'
            details:
              - field: name
                reason: NotBlank
                message: 姓名不能为空
              - field: email
                reason: Email
                message: 邮箱格式不正确
    NotImplemented:
      description: 骨架期占位，`code` 为 `EC-50000`
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/VoidResponse'
          example:
            code: EC-50000
            message: 基本信息板块查询尚未实现
            traceId: a1b2c3d4e5f60708
            timestamp: '2026-11-26T15:23:50+08:00'
    InternalError:
      description: 系统异常，`code` 为 `EC-50001`
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/VoidResponse'

  schemas:
    Result:
      type: object
      description: 统一响应体，所有接口的公共外壳
      required: [code, message, traceId, timestamp]
      properties:
        code:
          type: string
          description: 业务码，成功为 `'0'`，失败为 `EC-xxxxx`
          example: '0'
        message:
          type: string
          description: 提示文案，可直接展示
          example: 操作成功
        traceId:
          type: string
          description: 链路追踪号，对应服务端日志 MDC
          example: a1b2c3d4e5f60708
        timestamp:
          type: string
          description: 服务端时间，ISO-8601 带时区偏移
          example: '2026-11-26T15:23:50+08:00'
        data:
          description: |
            业务数据，仅成功且存在数据时出现。类型随接口而定：
            板块详情为 `SectionVO`，列表为 `PageResult`，保存与提交接口不返回该字段。
        details:
          type: array
          description: 字段级错误明细，仅 `EC-42201` 时出现
          items:
            $ref: '#/components/schemas/FieldErrorDetail'

    VoidResponse:
      allOf:
        - $ref: '#/components/schemas/Result'

    SectionDetailResponse:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/SectionVO'

    LoginResponse:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/LoginVO'

    UserResponse:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/UserVO'

    LoginVO:
      type: object
      description: 登录结果。令牌与用户信息一次返回，前端不必登录后再请求 `/auth/me`。
      required: [token, tokenType, expiresIn, user]
      properties:
        token:
          type: string
          description: 'JWT，前端拼成 `Authorization: Bearer <token>` 后随请求发送'
          example: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiIxMDAxIn0.7bJ3Y2xk
        tokenType:
          type: string
          description: 固定 `Bearer`，便于前端拼接头
          example: Bearer
        expiresIn:
          type: integer
          format: int64
          description: 有效期秒数，前端据此提前刷新或提示
          example: 28800
        user:
          $ref: '#/components/schemas/UserVO'

    UserVO:
      type: object
      description: |
        当前登录用户。只含前端渲染所需信息：`role` 决定菜单与按钮，
        `studentId` 决定学生端读哪一份档案。手机号、身份证等业务字段仍走板块接口并按权限脱敏。
      required: [userId, username, displayName, role, roleLabel, tempGrant]
      properties:
        userId:
          type: integer
          format: int64
          example: 1001
        username:
          type: string
          description: 登录名，学生为学号，教师为工号
          example: '2023010101'
        displayName:
          type: string
          example: 林清和
        role:
          type: string
          description: 角色编码
          enum: [STU, COU, ADMIN]
          example: STU
        roleLabel:
          type: string
          description: 角色中文名，前端直接展示
          example: 学生
        studentId:
          type: integer
          format: int64
          nullable: true
          description: 学生账号关联的学生 ID，其他角色为 `null`
          example: 1001
        tempGrant:
          type: boolean
          description: 管理员是否持临时只读授权；非管理员恒为 `false`
          example: false

    LoginDTO:
      type: object
      description: 登录入参
      required: [username, password]
      properties:
        username:
          type: string
          maxLength: 64
          example: '2023010101'
        password:
          type: string
          maxLength: 128
          description: 明文密码，仅经 HTTPS 传输，服务端用 PBKDF2 比对摘要
          example: Passw0rd!

    ValidationErrorResponse:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            details:
              type: array
              items:
                $ref: '#/components/schemas/FieldErrorDetail'

    FieldErrorDetail:
      type: object
      description: 字段级错误明细
      properties:
        field:
          type: string
          description: 出错的字段名，与 SaveDTO 属性名一致
          example: email
        reason:
          type: string
          description: 机器可读的原因，如 NotBlank / Email / Size
          example: Email
        message:
          type: string
          description: 可直接展示的中文提示
          example: 邮箱格式不正确

    SectionVO:
      type: object
      description: |
        板块详情。外层是公共信封，板块自身字段统一放在 `fields` 内，
        由后端按 `arc_field_def` 动态下发。
      required: [studentId, academicYear, sectionCode, sectionName, status, fields, editable]
      properties:
        studentId:
          type: integer
          format: int64
          example: 1001
        academicYear:
          type: string
          example: 2025-2026-1
        sectionCode:
          type: string
          description: 板块编码，大写
          enum: [BASIC, ACADEMIC, INTEREST, LIFE, CAREER, MENTOR]
        sectionName:
          type: string
          example: 基本信息
        status:
          $ref: '#/components/schemas/ProfileStatus'
        fields:
          type: object
          additionalProperties: true
          description: |
            板块字段值，键为字段短名（`basic.studentNo` → `studentNo`）。
            不可见字段不返回；敏感字段默认脱敏，辅导员可通过 reveal 接口二次查看明文。
        fieldMeta:
          type: array
          description: 字段渲染与权限位，仅含当前角色可见字段，按 sort_no 排序
          items:
            $ref: '#/components/schemas/FieldMeta'
        editable:
          type: boolean
          description: 当前用户是否有任一可编辑字段
        completeness:
          type: number
          description: 完成度百分比，只统计必填且启用字段（系统推导字段不计入）
          example: 62.50
        submitCount:
          type: integer
          description: 提交次数
          example: 0
        withdrawCount:
          type: integer
          description: 撤回次数，全生命周期上限 1
          example: 0
        submittedAt:
          type: string
          description: 最近一次提交时间
          example: '2026-11-26 17:20:00'
        reviewReason:
          type: string
          description: |
            最近一次退回理由（BR-S04：理由对学生可见）。
            仅当 status 为 RETURNED 时返回；重新提交后不再返回，避免旧意见被当成当前结论。
          example: 紧急联系人关系未注明，请补充与本人关系后重新提交
        reviewedAt:
          type: string
          description: 最近一次退回时间，与 reviewReason 同时返回
          example: '2026-11-26 20:39:25'

    FieldMeta:
      type: object
      description: 字段渲染与权限位，由 `arc_field_def` 与当前角色、板块状态共同计算
      required: [key, fieldCode, fieldName, fieldType, required, editable]
      properties:
        key:
          type: string
          description: 字段短名，与 `fields` 的键一致
          example: phone
        fieldCode:
          type: string
          example: basic.phone
        fieldName:
          type: string
          example: 手机
        fieldType:
          type: string
          description: 控件类型
          enum: [TEXT, TEXTAREA, NUMBER, DATE, SELECT, MULTI_SELECT, RADIO, CHECKBOX, FILE]
        required:
          type: boolean
          description: 提交时是否必填
        source:
          type: string
          description: 值来源，前端据此展示「由学校维护」等提示
          enum: [SIS, COU, STU, STU_CFM, SYS, IMP]
        options:
          type: array
          description: 枚举选项；非枚举字段不返回
          items:
            $ref: '#/components/schemas/FieldOption'
        sensitive:
          type: integer
          description: 0 普通 / 1 脱敏展示 / 2 仅辅导员可查看完整值
          example: 1
        editable:
          type: boolean
          description: 当前角色在当次请求下是否可写
        masked:
          type: boolean
          description: 本次返回的值是否已脱敏
        pendingConfirm:
          type: boolean
          description: 是否存在待辅导员确认的值（BR-F06）
        pendingValue:
          description: 待确认值，已按角色脱敏
          nullable: true

    FieldOption:
      type: object
      required: [value, label]
      properties:
        value:
          type: string
          description: 存库值
          example: M
        label:
          type: string
          description: 展示文案
          example: 男

    ProfileStatus:
      type: string
      description: |
        档案板块状态。`DRAFT` 草稿、`SUBMITTED` 已提交、`RETURNED` 已退回、
        `APPROVED` 已通过、`LOCKED` 已归档。仅 `DRAFT` / `RETURNED` 允许保存与提交。
      enum: [DRAFT, SUBMITTED, RETURNED, APPROVED, LOCKED]

    PageResult:
      type: object
      description: 分页载体，列表类接口统一使用（班级台账、审计日志等，本期尚未开放）
      required: [records, total, pageNum, pageSize]
      properties:
        records:
          type: array
          items: {}
        total:
          type: integer
          format: int64
          description: 记录总数
        pageNum:
          type: integer
          format: int64
          description: 页码，从 1 开始
        pageSize:
          type: integer
          format: int64
          description: 每页条数

    BasicSectionSaveDTO:
      type: object
      description: |
        基本信息保存请求，对应 `BasicSectionSaveDTO`。
        字段清单不在契约里逐个声明，以 `arc_field_def` 中 `section_code=BASIC` 的 16 条记录为准；
        这样字段增删只需要改种子数据，不需要同时改 DTO、契约与前端。
      required: [fields]
      properties:
        academicYear:
          type: string
          description: 学年，格式 `2025-2026-1`；不传取当前学年
          example: 2025-2026-1
        fields:
          type: object
          description: |
            字段值，键为字段短名，值为原始 JSON 值（单值或数组）。
            未出现的键按「不修改」处理；传 `null` 表示清空。
          additionalProperties: true
          example:
            classId: RJ2401
            phone: '13900005678'
            email: linqinghe@example.edu.cn
            emergencyContact: 林建国（父）
            emergencyPhone: '13900001234'
            photo: [10231]

    AcademicSectionSaveDTO:
      type: object
      description: 学业发展保存请求，对应 `AcademicSectionSaveDTO`
      required: [academicYear]
      properties:
        academicYear:
          type: string
          example: 2025-2026-1
        goalShort:
          type: string
          description: 短期目标
        goalLong:
          type: string
          description: 长期目标
        strongSubjects:
          type: array
          description: 优势科目
          items:
            type: string
        weakSubjects:
          type: array
          description: 待提升科目
          items:
            type: string
        abilityNote:
          type: string
          description: 能力自评

    InterestSectionSaveDTO:
      type: object
      description: 兴趣特长保存请求，对应 `InterestSectionSaveDTO`
      required: [academicYear]
      properties:
        academicYear:
          type: string
          example: 2025-2026-1
        hobbies:
          type: array
          description: 兴趣标签
          items:
            type: string
        hobbyDesc:
          type: string
          description: 兴趣描述
        skills:
          type: string
          description: 特长技能
        ideal:
          type: string
          description: 理想状态

    LifeSectionSaveDTO:
      type: object
      description: 生活心理保存请求，对应 `LifeSectionSaveDTO`
      required: [academicYear]
      properties:
        academicYear:
          type: string
          example: 2025-2026-1
        orgRole:
          type: string
          description: 组织职务
        orgLevel:
          type: string
          description: 组织层级
        sleepHabit:
          type: string
          description: 作息习惯
        exerciseFreq:
          type: string
          description: 运动频率
        stressScore:
          type: integer
          description: 压力指数，1-10
          minimum: 1
          maximum: 10
        mood:
          type: string
          description: 近期心情

    CareerSectionSaveDTO:
      type: object
      description: 职业规划保存请求，对应 `CareerSectionSaveDTO`
      required: [academicYear]
      properties:
        academicYear:
          type: string
          example: 2025-2026-1
        intention:
          type: string
          description: 就业意向
        industry:
          type: string
          description: 目标行业
        position:
          type: string
          description: 目标岗位
        plan:
          type: string
          description: 实施计划
        support:
          type: string
          description: 需要支持

    MentorSectionSaveDTO:
      type: object
      description: 导师寄语保存请求，对应 `MentorSectionSaveDTO`；仅导师角色可写
      required: [academicYear]
      properties:
        academicYear:
          type: string
          example: 2025-2026-1
        talkDate:
          type: string
          format: date
          description: 谈话日期
          example: '2026-11-10'
        topic:
          type: string
          description: 谈话主题
        advice:
          type: string
          description: 导师建议
        starLevel:
          type: integer
          description: 星级评分，1-5
          minimum: 1
          maximum: 5
        feedback:
          type: string
          description: 学生反馈

    ReviewTaskVO:
      type: object
      description: 待审列表行（一个学生 × 一个板块）
      properties:
        profileId:
          type: integer
          format: int64
          description: 板块实例 ID
          example: 3001
        studentId:
          type: integer
          format: int64
          example: 1001
        studentName:
          type: string
          description: 学生姓名，取自 basic.name
          example: 林清和
        classId:
          type: string
          description: 班级编码，取自 basic.classId
          example: RJ2401
        className:
          type: string
          description: 班级名称，取自 org_class
          example: 软件2401
        sectionCode:
          type: string
          example: BASIC
        sectionName:
          type: string
          example: 基本信息
        academicYear:
          type: string
          example: 2025-2026-1
        status:
          type: string
          enum: [DRAFT, SUBMITTED, RETURNED, APPROVED, LOCKED]
          example: SUBMITTED
        statusLabel:
          type: string
          example: 已提交
        completeness:
          type: number
          example: 100.00
        submitCount:
          type: integer
          example: 1
        submittedAt:
          type: string
          format: date-time
          nullable: true
        reviewerId:
          type: integer
          format: int64
          nullable: true
        reviewedAt:
          type: string
          format: date-time
          nullable: true

    ReviewTaskPage:
      type: object
      description: 待审列表分页结果
      properties:
        records:
          type: array
          items:
            $ref: '#/components/schemas/ReviewTaskVO'
        total:
          type: integer
          format: int64
          example: 12
        pageNum:
          type: integer
          format: int64
          example: 1
        pageSize:
          type: integer
          format: int64
          example: 20

    ReviewDecisionDTO:
      type: object
      description: 审核结论入参
      properties:
        academicYear:
          type: string
          description: 学年，为空取当前学年
          example: 2025-2026-1
        comment:
          type: string
          description: 审核意见，通过时可空，最多 255 字
          maxLength: 255
          example: 材料齐全，同意通过
        reason:
          type: string
          description: 退回理由，退回时必填且不少于 10 字
          maxLength: 255
          example: 紧急联系人电话与本人电话重复，请核对后重新提交

    PendingFieldVO:
      type: object
      description: 待确认字段处理结果
      properties:
        fieldCode:
          type: string
          example: basic.phone
        fieldName:
          type: string
          example: 手机
        value:
          description: 处理后的对外值，敏感字段为脱敏值
          nullable: true
          example: 139****9000
        confirmStatus:
          type: string
          enum: [APPROVED, REJECTED]
          example: APPROVED

    ClassEnrollVO:
      type: object
      description: 可建档班级行（批量建档页）
      required: [classCode, className, studentCount, enrolledStudentCount, missingStudentCount, enrolled]
      properties:
        classCode:
          type: string
          example: RJ2401
        className:
          type: string
          example: 软件2401
        majorName:
          type: string
          example: 软件工程
        gradeYear:
          type: integer
          example: 2024
        studentCount:
          type: integer
          description: 本班在读学生数（取学生主数据，不含休学、退学）
          example: 2
        enrolledStudentCount:
          type: integer
          description: 六板块实例齐全的学生数
          example: 1
        missingStudentCount:
          type: integer
          description: 仍有板块缺失的学生数
          example: 1
        enrolled:
          type: boolean
          description: 是否已全部建档
          example: false

    BatchCreateDTO:
      type: object
      description: 批量建档入参
      required: [classCodes]
      properties:
        academicYear:
          type: string
          description: 学年，为空取当前学年
          example: 2025-2026-1
        classCodes:
          type: array
          description: 班级编码集合，最多 20 个
          maxItems: 20
          items:
            type: string
          example: [RJ2401, RJ2402]

    StudentEnrollItemVO:
      type: object
      description: 单个学生的建档结果
      properties:
        studentId:
          type: integer
          format: int64
          example: 1001
        studentNo:
          type: string
          example: '2024010101'
        studentName:
          type: string
          example: 李明
        classCode:
          type: string
          example: RJ2401
        className:
          type: string
          example: 软件2401
        createdSections:
          type: array
          description: 本次新建的板块编码（大写）
          items:
            type: string
          example: [ACADEMIC, INTEREST]
        skippedSectionCount:
          type: integer
          description: 本次跳过（已存在）的板块数量
          example: 4
        status:
          type: string
          enum: [CREATED, SKIPPED]
          description: CREATED 表示新建了至少一个板块；SKIPPED 表示六板块均已存在
          example: CREATED

    BatchCreateResultVO:
      type: object
      description: 批量建档结果汇总
      properties:
        academicYear:
          type: string
          example: 2025-2026-1
        classCodes:
          type: array
          items:
            type: string
          example: [RJ2401]
        totalStudents:
          type: integer
          example: 2
        createdStudents:
          type: integer
          description: 本次新建了至少一个板块的学生数
          example: 1
        skippedStudents:
          type: integer
          description: 六板块均已存在、整人跳过的学生数
          example: 1
        createdProfiles:
          type: integer
          description: 本次新建的板块实例总数
          example: 5
        existingProfiles:
          type: integer
          description: 已存在并跳过的板块实例总数
          example: 7
        students:
          type: array
          items:
            $ref: '#/components/schemas/StudentEnrollItemVO'

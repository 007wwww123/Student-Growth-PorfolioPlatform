      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [classCode, className, majorId, gradeYear]
              properties:
                classCode: { type: string }
                className: { type: string }
                majorId: { type: integer, format: int64 }
                gradeYear: { type: integer }
                counselorUserId: { type: integer, format: int64 }
      responses:
        '200':
          description: 修改结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectResponse'

  /org/classes/{id}/counselor:
    put:
      tags: [系统管理]
      operationId: assignCounselor
      summary: 绑定/换绑辅导员
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [counselorUserId]
              properties:
                counselorUserId: { type: integer, format: int64 }
      responses:
        '200':
          description: 绑定结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectResponse'

  /org/classes/{id}/status:
    put:
      tags: [系统管理]
      operationId: updateClassStatus
      summary: 启用/停用班级（有在读学生时拒绝）
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: integer, enum: [0, 1] }
      responses:
        '200':
          description: 操作成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoidResponse'

  /account/users:
    get:
      tags: [系统管理]
      operationId: listAccounts
      summary: 账号列表（`account:user:manage`）
      parameters:
        - { name: role, in: query, required: false, schema: { type: string, enum: [STU, COU, ADMIN] } }
        - { name: status, in: query, required: false, schema: { type: integer, enum: [0, 1] } }
        - { name: keyword, in: query, required: false, schema: { type: string } }
        - { name: pageNum, in: query, required: false, schema: { type: integer, default: 1 } }
        - { name: pageSize, in: query, required: false, schema: { type: integer, default: 20 } }
      responses:
        '200':
          description: 账号分页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectResponse'
    post:
      tags: [系统管理]
      operationId: createAccount
      summary: 开通账号（返回一次初始密码）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [displayName, role]
              properties:
                username: { type: string }
                displayName: { type: string }
                role: { type: string, enum: [STU, COU, ADMIN] }
                studentId: { type: integer, format: int64, description: 学生账号必填 }
                password: { type: string, description: 为空时学生取身份证后六位、其他角色随机 }
      responses:
        '200':
          description: 开通结果（含初始密码）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectResponse'

  /account/users/{id}/status:
    put:
      tags: [系统管理]
      operationId: updateAccountStatus
      summary: 启用/停用账号（不能停用自己）
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: integer, enum: [0, 1] }
      responses:
        '200':
          description: 操作成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoidResponse'

  /account/users/{id}/reset-password:
    post:
      tags: [系统管理]
      operationId: resetAccountPassword
      summary: 重置密码（不传密码则随机生成并返回一次）
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                password: { type: string, minLength: 8, maxLength: 20 }
      responses:
        '200':
          description: 重置结果（含新密码）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectResponse'

  /account/users/{id}/role:
    put:
      tags: [系统管理]
      operationId: assignAccountRole
      summary: 分配角色（学生账号不可改）
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, enum: [STU, COU, ADMIN] }
      responses:
        '200':
          description: 操作成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoidResponse'

  /account/batch-open:
    post:
      tags: [系统管理]
      operationId: batchOpenAccounts
      summary: 按班级批量开通学生账号
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [classCodes]
              properties:
                classCodes:
                  type: array
                  items: { type: string }
      responses:
        '200':
          description: 批量结果（含初始密码）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        登录后返回的 JWT，放在 `Authorization: Bearer <token>` 中。
        除 `POST /auth/login` 与 `/actuator/**` 外，所有接口都必须携带。

  parameters:
    SectionCode:
      name: code
      in: path
      required: true
      description: 板块编码，小写，与 `SectionCodeEnum.code` 一致
      schema:
        type: string
        enum: [basic, academic, interest, life, career, mentor]
    StudentId:
      name: studentId
      in: path
      required: true
      description: 学生 ID，正整数
      schema:
        type: integer
        format: int64
        minimum: 1
        example: 1001
    AcademicYearQuery:
      name: academicYear
      in: query
      required: false
      description: 学年，格式 `2025-2026-1`；不传时取当前学年
      schema:
        type: string
        example: 2025-2026-1

  responses:
    Unauthorized:
      description: 未登录或登录失效，`code` 为 `EC-40101` / `EC-40102` / `EC-40104`
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/VoidResponse'
          example:
            code: EC-40101
            message: 登录已失效，请重新登录
            traceId: a1b2c3d4e5f60708
            timestamp: '2026-11-26T15:23:50+08:00'
    BadRequest:
      description: 参数错误，`code` 为 `EC-40001` / `EC-40002` / `EC-40003`
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/VoidResponse'
    Forbidden:
      description: 无权限，`code` 为 `EC-40301` / `EC-40302` / `EC-40303` / `EC-40303`
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/VoidResponse'
    Conflict:
      description: 状态冲突，`code` 为 `EC-40902` / `EC-40903`
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/VoidResponse'
          example:
            code: EC-40902
            message: 当前状态不允许该操作
            traceId: a1b2c3d4e5f60708
            timestamp: '2026-11-26T15:23:50+08:00'
    ValidationFailed:
      description: 字段校验失败，`code` 为 `EC-42201`
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
          example:
            code: EC-42201
            message: 字段校验未通过
            traceId: a1b2c3d4e5f60708
            timestamp: '2026-11-26T15:23:50+08:00'
            details:
              - field: name
                reason: NotBlank
                message: 姓名不能为空
              - field: email
                reason: Email
                message: 邮箱格式不正确
    NotImplemented:
      description: 骨架期占位，`code` 为 `EC-50000`
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/VoidResponse'
          example:
            code: EC-50000
            message: 基本信息板块查询尚未实现
            traceId: a1b2c3d4e5f60708
            timestamp: '2026-11-26T15:23:50+08:00'
    InternalError:
      description: 系统异常，`code` 为 `EC-50001`
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/VoidResponse'

  schemas:
    Result:
      type: object
      description: 统一响应体，所有接口的公共外壳
      required: [code, message, traceId, timestamp]
      properties:
        code:
          type: string
          description: 业务码，成功为 `'0'`，失败为 `EC-xxxxx`
          example: '0'
        message:
          type: string
          description: 提示文案，可直接展示
          example: 操作成功
        traceId:
          type: string
          description: 链路追踪号，对应服务端日志 MDC
          example: a1b2c3d4e5f60708
        timestamp:
          type: string
          description: 服务端时间，ISO-8601 带时区偏移
          example: '2026-11-26T15:23:50+08:00'
        data:
          description: |
            业务数据，仅成功且存在数据时出现。类型随接口而定：
            板块详情为 `SectionVO`，列表为 `PageResult`，保存与提交接口不返回该字段。
        details:
          type: array
          description: 字段级错误明细，仅 `EC-42201` 时出现
          items:
            $ref: '#/components/schemas/FieldErrorDetail'

    VoidResponse:
      allOf:
        - $ref: '#/components/schemas/Result'

    ObjectResponse:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          description: data 为具体业务对象；系统管理类接口的细节以响应示例与代码为准。
          properties:
            data: {}

    SectionDetailResponse:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/SectionVO'

    LoginResponse:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/LoginVO'

    UserResponse:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/UserVO'

    LoginVO:
      type: object
      description: 登录结果。令牌与用户信息一次返回，前端不必登录后再请求 `/auth/me`。
      required: [token, tokenType, expiresIn, user]
      properties:
        token:
          type: string
          description: 'JWT，前端拼成 `Authorization: Bearer <token>` 后随请求发送'
          example: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiIxMDAxIn0.7bJ3Y2xk
        tokenType:
          type: string
          description: 固定 `Bearer`，便于前端拼接头
          example: Bearer
        expiresIn:
          type: integer
          format: int64
          description: 有效期秒数，前端据此提前刷新或提示
          example: 28800
        user:
          $ref: '#/components/schemas/UserVO'

    UserVO:
      type: object
      description: |
        当前登录用户。只含前端渲染所需信息：`role` 决定菜单与按钮，
        `studentId` 决定学生端读哪一份档案。手机号、身份证等业务字段仍走板块接口并按权限脱敏。
      required: [userId, username, displayName, role, roleLabel, tempGrant]
      properties:
        userId:
          type: integer
          format: int64
          example: 1001
        username:
          type: string
          description: 登录名，学生为学号，教师为工号
          example: '2024010101'
        displayName:
          type: string
          example: 李明
        role:
          type: string
          description: 角色编码
          enum: [STU, COU, ADMIN]
          example: STU
        roleLabel:
          type: string
          description: 角色中文名，前端直接展示
          example: 学生
        studentId:
          type: integer
          format: int64
          nullable: true
          description: 学生账号关联的学生 ID，其他角色为 `null`
          example: 1001
        tempGrant:
          type: boolean
          description: 管理员是否持临时只读授权；非管理员恒为 `false`
          example: false

    LoginDTO:
      type: object
      description: 登录入参
      required: [username, password]
      properties:
        username:
          type: string
          maxLength: 64
          example: '2024010101'
        password:
          type: string
          maxLength: 128
          description: 明文密码，仅经 HTTPS 传输，服务端用 PBKDF2 比对摘要
          example: Passw0rd!

    ValidationErrorResponse:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            details:
              type: array
              items:
                $ref: '#/components/schemas/FieldErrorDetail'

    FieldErrorDetail:
      type: object
      description: 字段级错误明细
      properties:
        field:
          type: string
          description: 出错的字段名，与 SaveDTO 属性名一致
          example: email
        reason:
          type: string
          description: 机器可读的原因，如 NotBlank / Email / Size
          example: Email
        message:
          type: string
          description: 可直接展示的中文提示
          example: 邮箱格式不正确

    SectionVO:
      type: object
      description: |
        板块详情。外层是公共信封，板块自身字段统一放在 `fields` 内，
        由后端按 `arc_field_def` 动态下发。
      required: [studentId, academicYear, sectionCode, sectionName, status, fields, editable]
      properties:
        studentId:
          type: integer
          format: int64
          example: 1001
        academicYear:
          type: string
          example: 2025-2026-1
        sectionCode:
          type: string
          description: 板块编码，大写
          enum: [BASIC, ACADEMIC, INTEREST, LIFE, CAREER, MENTOR]
        sectionName:
          type: string
          example: 基本信息
        status:
          $ref: '#/components/schemas/ProfileStatus'
        fields:
          type: object
          additionalProperties: true
          description: |
            板块字段值，键为字段短名（`basic.studentNo` → `studentNo`）。
            不可见字段不返回；敏感字段默认脱敏，辅导员可通过 reveal 接口二次查看明文。
        fieldMeta:
          type: array
          description: 字段渲染与权限位，仅含当前角色可见字段，按 sort_no 排序
          items:
            $ref: '#/components/schemas/FieldMeta'
        editable:
          type: boolean
          description: 当前用户是否有任一可编辑字段
        completeness:
          type: number
          description: 完成度百分比，只统计必填且启用字段（系统推导字段不计入）
          example: 62.50
        submitCount:
          type: integer
          description: 提交次数
          example: 0
        withdrawCount:
          type: integer
          description: 撤回次数，全生命周期上限 1
          example: 0
        submittedAt:
          type: string
          description: 最近一次提交时间
          example: '2026-11-26 17:20:00'
        reviewReason:
          type: string
          description: |
            最近一次退回理由（BR-S04：理由对学生可见）。
            仅当 status 为 RETURNED 时返回；重新提交后不再返回，避免旧意见被当成当前结论。
          example: 紧急联系人关系未注明，请补充与本人关系后重新提交
        reviewedAt:
          type: string
          description: 最近一次退回时间，与 reviewReason 同时返回
          example: '2026-11-26 20:39:25'

    FieldMeta:
      type: object
      description: 字段渲染与权限位，由 `arc_field_def` 与当前角色、板块状态共同计算
      required: [key, fieldCode, fieldName, fieldType, required, editable]
      properties:
        key:
          type: string
          description: 字段短名，与 `fields` 的键一致
          example: phone
        fieldCode:
          type: string
          example: basic.phone
        fieldName:
          type: string
          example: 手机
        fieldType:
          type: string
          description: 控件类型
          enum: [TEXT, TEXTAREA, NUMBER, DATE, SELECT, MULTI_SELECT, RADIO, CHECKBOX, FILE]
        required:
          type: boolean
          description: 提交时是否必填
        source:
          type: string
          description: 值来源，前端据此展示「由学校维护」等提示
          enum: [SIS, COU, STU, STU_CFM, SYS, IMP]
        options:
          type: array
          description: 枚举选项；非枚举字段不返回
          items:
            $ref: '#/components/schemas/FieldOption'
        sensitive:
          type: integer
          description: 0 普通 / 1 脱敏展示 / 2 仅辅导员可查看完整值
          example: 1
        editable:
          type: boolean
          description: 当前角色在当次请求下是否可写
        masked:
          type: boolean
          description: 本次返回的值是否已脱敏
        pendingConfirm:
          type: boolean
          description: 是否存在待辅导员确认的值（BR-F06）
        pendingValue:
          description: 待确认值，已按角色脱敏。pendingConfirm 为 true 且无候选值时表示申请清空。
          nullable: true

    FieldOption:
      type: object
      required: [value, label]
      properties:
        value:
          type: string
          description: 存库值
          example: M
        label:
          type: string
          description: 展示文案
          example: 男

    ProfileStatus:
      type: string
      description: |
        档案板块状态。`DRAFT` 草稿、`SUBMITTED` 已提交、`RETURNED` 已退回、
        `APPROVED` 已通过、`LOCKED` 已归档。仅 `DRAFT` / `RETURNED` 允许保存与提交。
      enum: [DRAFT, SUBMITTED, RETURNED, APPROVED, LOCKED]

    PageResult:
      type: object
      description: 分页载体，列表类接口统一使用（班级台账、审计日志等，本期尚未开放）
      required: [records, total, pageNum, pageSize]
      properties:
        records:
          type: array
          items: {}
        total:
          type: integer
          format: int64
          description: 记录总数
        pageNum:
          type: integer
          format: int64
          description: 页码，从 1 开始
        pageSize:
          type: integer
          format: int64
          description: 每页条数

    BasicSectionSaveDTO:
      type: object
      description: |
        基本信息保存请求，对应 `BasicSectionSaveDTO`。
        字段清单不在契约里逐个声明，以 `arc_field_def` 中 `section_code=BASIC` 的 16 条记录为准；
        这样字段增删只需要改种子数据，不需要同时改 DTO、契约与前端。
      required: [fields]
      properties:
        academicYear:
          type: string
          description: 学年，格式 `2025-2026-1`；不传取当前学年
          example: 2025-2026-1
        fields:
          type: object
          description: |
            字段值，键为字段短名，值为原始 JSON 值（单值或数组）。
            未出现的键按「不修改」处理；传 `null` 表示清空。
          additionalProperties: true
          example:
            phone: '13900005678'
            email: 1001@example.edu.cn
            emergencyContact: 李建国（父）
            emergencyPhone: '13900001234'

    AcademicSectionSaveDTO:
      type: object
      description: 学业发展保存请求，对应 `AcademicSectionSaveDTO`
      required: [academicYear]
      properties:
        academicYear:
          type: string
          example: 2025-2026-1
        goalShort:
          type: string
          description: 短期目标
        goalLong:
          type: string
          description: 长期目标
        strongSubjects:
          type: array
          description: 优势科目
          items:
            type: string
        weakSubjects:
          type: array
          description: 待提升科目
          items:
            type: string
        abilityNote:
          type: string
          description: 能力自评

    InterestSectionSaveDTO:
      type: object
      description: 兴趣特长保存请求，对应 `InterestSectionSaveDTO`
      required: [academicYear]
      properties:
        academicYear:
          type: string
          example: 2025-2026-1
        hobbies:
          type: array
          description: 兴趣标签
          items:
            type: string
        hobbyDesc:
          type: string
          description: 兴趣描述
        skills:
          type: string
          description: 特长技能
        ideal:
          type: string
          description: 理想状态

    LifeSectionSaveDTO:
      type: object
      description: |
        生活心理保存请求，对应 `LifeSectionSaveDTO`。

        与学业、兴趣同一套「信封 + `fields`」结构：字段短名作 `fields` 的键，
        类型、必填、枚举、长度、可编辑角色全部来自 `arc_field_def`，因此这里不再逐字段声明——
        新增或调整字段不需要改契约。平铺写法（把字段直接放在顶层）仍被接受，用于兼容早期联调脚本。
      required: [academicYear]
      properties:
        academicYear:
          type: string
          example: 2025-2026-1
        fields:
          type: object
          description: 字段短名 → 值；值为 `null` 表示清空该字段
          additionalProperties: true
          example:
            orgRole: 班级学习委员
            orgLevel: MID
            sleepHabit: NORMAL
            exerciseFreq: MID
            personality: 偏内向，熟悉后活跃
            econSelf: NORMAL
            stressScore: 3
            stressSource: [学业, 就业]
            mood: FAIR

    CareerSectionSaveDTO:
      type: object
      description: |
        职业规划保存请求，对应 `CareerSectionSaveDTO`。

        与其余板块同一套「信封 + `fields`」结构，字段元数据全部来自 `arc_field_def`；
        平铺写法仍被接受，用于兼容早期联调脚本。本板块只记录规划意图，
        毕业去向的最终值以就业系统为准，不作为统计口径。
      required: [academicYear]
      properties:
        academicYear:
          type: string
          example: 2025-2026-1
        fields:
          type: object
          description: 字段短名 → 值；值为 `null` 表示清空该字段
          additionalProperties: true
          example:
            intention: POSTGRAD
            industry: 工业软件
            position: 后端开发工程师
            plan: 已完成两个 Spring Boot 项目，刷题 200 道
            support: 希望获得实习内推与简历修改建议

    MentorSectionSaveDTO:
      type: object
      description: |
        导师寄语保存请求，对应 `MentorSectionSaveDTO`。与其余五个板块共用「信封 + fields」契约，
        但本板块**没有主表字段值**（需求 4.7），谈话内容在 `arc_mentor_note` 子表，
        通过 `POST /sections/mentor/{studentId}/notes` 追加。
        因此 `fields` 只允许为空；传非空字段返回 `EC-40003` 并提示改用追加接口。
        保留该端点是为了六板块 GET/PUT/submit/withdraw 结构一致。
      required: [academicYear]
      properties:
        academicYear:
          type: string
          example: 2025-2026-1
        fields:
          type: object
          additionalProperties: true
          description: 主表字段值；MENTOR 恒为空对象
          example: {}
      example:
        academicYear: 2025-2026-1
        fields: {}

    MentorNoteCreateDTO:
      type: object
      description: |
        追加一条谈话记录（仅本班辅导员，`archive:mentor:append`）。
        只追加、不提供修改/删除（BR-S07）。必填与长度由 `arc_field_def` 的
        `mentor.talkDate` / `mentor.topic` / `mentor.advice` 等字段定义执行，
        错误码统一为 `EC-42201` / `EC-42202`。
      required: [academicYear, talkDate, topic, advice]
      properties:
        academicYear:
          type: string
          example: 2025-2026-1
        talkDate:
          type: string
          format: date
          description: 谈话日期，不晚于今天且不早于入学日期
          example: '2026-04-18'
        topic:
          type: string
          description: 主题英文码，命中字典 talk_topic
          enum: [ACADEMIC, CAREER, PSYCH, DAILY]
          example: ACADEMIC
        advice:
          type: string
          description: 建议与寄语，20–1000 字，学生可见
          example: 本学期重点补齐算法基础，建议参加校赛练手
        starLevel:
          type: integer
          description: 重要标记 0 无 / 1 ★ / 2 ★★
          minimum: 0
          maximum: 2
          example: 1
        internalRemark:
          type: string
          description: 辅导员内部备注，不超过 500 字；学生端不返回
          example: 家庭经济困难，需留意勤工助学名额

    MentorFeedbackDTO:
      type: object
      description: 学生反馈入参（`archive:mentor:feedback`）；每条谈话仅可提交一次，提交后锁定
      required: [feedback]
      properties:
        academicYear:
          type: string
          example: 2025-2026-1
        feedback:
          type: string
          description: 学生反馈与承诺，不超过 500 字
          example: 已报名校赛，每周刷题 20 道

    MentorNoteVO:
      type: object
      description: |
        时间线上的一条谈话记录。学生端不返回 `internalRemark` 与 `counselorId`
        （服务端组装时裁剪，响应体里没有这两个键），作者只显示 `authorLabel` = 「辅导员」。
      properties:
        id:
          type: integer
          format: int64
          example: 5001
        talkDate:
          type: string
          format: date
          example: '2026-04-18'
        topic:
          type: string
          example: ACADEMIC
        topicLabel:
          type: string
          example: 学业规划
        advice:
          type: string
        starLevel:
          type: integer
          example: 1
        feedback:
          type: string
          nullable: true
        feedbackAt:
          type: string
          format: date-time
          nullable: true
        canFeedback:
          type: boolean
          description: 仅学生端有意义；feedbackAt 为空时为真
        authorLabel:
          type: string
          example: 辅导员
        createdAt:
          type: string
          format: date-time
        internalRemark:
          type: string
          description: 仅辅导员端返回
        counselorId:
          type: integer
          format: int64
          description: 仅辅导员端返回

    MentorSectionVO:
      type: object
      description: |
        导师寄语详情。信封字段与 `SectionDetailResponse` 一致，额外带 `notes` 时间线；
        `fields` 恒为空 Map，`fieldMeta` 仍按角色下发（追加表单与反馈框共用字段定义）。
      properties:
        studentId:
          type: integer
          format: int64
        academicYear:
          type: string
        sectionCode:
          type: string
          example: MENTOR
        sectionName:
          type: string
          example: 导师寄语
        status:
          type: string
          enum: [DRAFT, SUBMITTED, RETURNED, APPROVED, LOCKED]
          example: DRAFT
        fields:
          type: object
          additionalProperties: true
          example: {}
        fieldMeta:
          type: array
          items:
            $ref: '#/components/schemas/FieldMeta'
        editable:
          type: boolean
        completeness:
          type: number
          format: double
          example: 100.00
        submitCount:
          type: integer
        withdrawCount:
          type: integer
        submittedAt:
          type: string
          format: date-time
          nullable: true
        reviewReason:
          type: string
          description: 仅 RETURNED 时返回
        reviewedAt:
          type: string
          format: date-time
          description: 仅 RETURNED 时返回
        notes:
          type: array
          description: 按 talkDate 倒序
          items:
            $ref: '#/components/schemas/MentorNoteVO'
        canAppend:
          type: boolean
          description: 仅该班辅导员且板块未归档时为真

    ReviewTaskVO:
      type: object
      description: 待审列表行（一个学生 × 一个板块）
      properties:
        profileId:
          type: integer
          format: int64
          description: 板块实例 ID
          example: 3001
        studentId:
          type: integer
          format: int64
          example: 1001
        studentName:
          type: string
          description: 学生姓名，取自 basic.name
          example: 李明
        classId:
          type: string
          description: 班级编码，取自 basic.classId
          example: RJ2401
        className:
          type: string
          description: 班级名称，取自 org_class
          example: 软件2401
        sectionCode:
          type: string
          example: BASIC
        sectionName:
          type: string
          example: 基本信息
        academicYear:
          type: string
          example: 2025-2026-1
        status:
          type: string
          enum: [DRAFT, SUBMITTED, RETURNED, APPROVED, LOCKED]
          example: SUBMITTED
        statusLabel:
          type: string
          example: 已提交
        completeness:
          type: number
          example: 100.00
        submitCount:
          type: integer
          example: 1
        submittedAt:
          type: string
          format: date-time
          nullable: true
        reviewerId:
          type: integer
          format: int64
          nullable: true
        reviewedAt:
          type: string
          format: date-time
          nullable: true

    ReviewTaskPage:
      type: object
      description: 待审列表分页结果
      properties:
        records:
          type: array
          items:
            $ref: '#/components/schemas/ReviewTaskVO'
        total:
          type: integer
          format: int64
          example: 12
        pageNum:
          type: integer
          format: int64
          example: 1
        pageSize:
          type: integer
          format: int64
          example: 20

    ReviewDecisionDTO:
      type: object
      description: 审核结论入参
      properties:
        academicYear:
          type: string
          description: 学年，为空取当前学年
          example: 2025-2026-1
        comment:
          type: string
          description: 审核意见，通过时可空，最多 255 字
          maxLength: 255
          example: 材料齐全，同意通过
        reason:
          type: string
          description: 退回理由，退回时必填且不少于 10 字
          maxLength: 255
          example: 紧急联系人电话与本人电话重复，请核对后重新提交

    PendingFieldVO:
      type: object

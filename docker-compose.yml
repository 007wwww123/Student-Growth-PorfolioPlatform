# 本地开发依赖（MySQL 8 + Redis 7），仅用于开发环境；生产按需求文档 1.4 用五容器编排。
# 启动：docker compose up -d
services:
  mysql:
    image: mysql:8.0.32
    container_name: growth-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: student_growth
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
    ports:
      - "3306:3306"
    volumes:
      - growth-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: growth-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - growth-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  growth-mysql-data:
  growth-redis-data:
